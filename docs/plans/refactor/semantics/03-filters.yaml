# 스케줄 대상 선정 필터 — "이 문자를 누구에게 보낼 것인가" 를 SQL 조건으로 만드는 곳.
# 예외가 가장 밀집된 모듈. 옛 형식(v1)과 새 형식(v2)이 DB에 섞여 있어 읽을 때 변환한다.

- module: services/filters.py
  fns:
    stay_coverage_filter:
      역할: "'그 날짜에 우리 집에 있는 예약' 을 잡는 표준 조건. 이 시스템에서 날짜 기준 조회의 정답지"
      등급: D
      핵심: true
      주의: |
        조건이 두 갈래 OR 이고, 두 번째(체크인 == 그날)가 까다로운 경우들을 한꺼번에 흡수한다.
          포함 → 첫날 / 연박 중간일 / 체크아웃이 비어있는 당일예약 / 체크인=체크아웃 당일건
          제외 → 퇴실일(그날 나가는 사람), 무관한 예약
        두 번째 분기를 빼면 당일예약과 NULL 체크아웃 손님이 통째로 사라진다.
        상태(취소 등)와 구역 조건은 여기 없다 — 호출자가 따로 붙여야 함
    activity_stats_filter:
      역할: "인원 통계에서 액티비티 손님을 격리한다. 단, 그 날짜에 파티에 참여하는 액티비티 손님은 포함"
      등급: D
      핵심: true
      주의: "그 날짜의 파티차수는 날짜별 지정값 우선(coalesce). 구역이 NULL 이면 액티비티가 아닌 것으로 취급"
    _is_v2_shape:
      역할: "저장된 필터가 새 형식인지 옛 형식인지 추정"
      등급: L
      주의: "옛 전용 표시(building/room/room_assigned/party_only)가 없으면 새 형식으로 본다. 즉 애매하면 새 형식 쪽으로 기운다"
    _normalize_to_v2:
      역할: "옛 형식 필터를 새 형식으로 변환. 몇 번을 돌려도 결과가 같다(멱등)"
      등급: L
      핵심: true
      주의: |
        변환 규칙이 여러 개다.
          · room_assigned → 객실, party_only → 파티만
          · room 타입은 유령이라 버림
          · building 항목들은 객실 필터 안의 buildings 목록으로 합침. 객실 필터가 없으면 만들어냄
          · '미배정' 은 객실 필터가 있으면 그 안의 옵션으로 접어 넣고, 없으면 독립 항목으로 유지
          · 모르는 항목은 버리지 않고 그대로 통과시킨다 (데이터 유실 방지)
        건물 번호가 숫자로 안 바뀌면 조용히 버린다.
    _parse_filters:
      역할: "DB에 문자열로 저장된 필터를 읽어 새 형식 목록으로 만든다"
      등급: L
      주의: "JSON 이 깨졌으면 빈 목록을 돌려준다 — 필터 없음 = 전체 대상이 되므로, 파싱 실패가 조용히 '전원 발송' 으로 이어질 수 있다"
    extract_stay_filter:
      역할: "'연박자 제외' 옵션을 읽는다"
      등급: L
      주의: "새 형식(객실 필터 안)을 먼저 보고, 없으면 옛 컬럼으로 폴백한다. 객실이 아닌 필터(파티 등)에 옛 연박옵션이 붙어 있으면 UI 위반이라 중요 로그를 남기지만 값은 그대로 쓴다"
    _condition_room:
      역할: "'객실 구역' 조건을 만든다. 건물을 지정했으면 그 날짜에 그 건물 방에 배정된 사람으로 좁힌다"
      등급: D
      핵심: true
      주의: "'미배정 포함' 옵션이 켜지면 OR 로 미배정 구역까지 넣는다. 후보 사전추림 모드에서는 건물 조건을 일부러 끄고(날짜 의존이라) 나중에 날짜별로 다시 검사한다"
    _condition_simple_assignment:
      역할: "파티만 / 미배정 / 언스테이블 구역 조건을 만든다"
      등급: D
      주의: "언스테이블은 구역이 언스테이블인 사람뿐 아니라, **그 날짜에 언스테이블 파티 참여로 표시된 다른 구역 손님도 OR 로 포함**한다. 이 확장을 빼먹으면 대상이 줄어든다"
    _condition_assignment:
      역할: "구역 조건 만들기의 분기점 (객실이면 건물 처리, 나머지는 단순 조건)"
      등급: D
    _escape_like:
      역할: "검색어에 들어간 %, _, \\ 를 글자 그대로 찾도록 escape"
      등급: G
      주의: "이걸 빼면 운영자가 입력한 '%' 가 와일드카드로 동작해 엉뚱한 대상이 잡힌다"
    _condition_column_match:
      역할: "'특정 칸의 값이 이렇다' 조건을 만든다 (파티차수·성별·객실타입·메모·이름)"
      등급: D
      핵심: true
      주의: |
        칸마다 처리가 완전히 다르다.
        · 파티차수 — 그 날짜의 지정값 우선(coalesce). 4개 연산자(비었나/안비었나/포함/미포함)
        · 메모 — **투숙 전 기간을 훑는다**. 운영자가 어느 날 메모를 넣든 첫밤·마지막밤 스케줄이
          둘 다 걸리게 하려는 의도. 1박(체크아웃 NULL 또는 체크인=체크아웃)과 다박을 나눠서
          날짜 범위를 만들고, 날짜별 메모 OR 예약 메모를 함께 본다.
          '미포함' 은 어디에도 없어야 참이고, NULL 도 미포함으로 친다
        · 나머지 칸 — 예약 컬럼 직접 비교
        허용된 칸 목록에 없으면 조건을 안 만들고 None 을 돌려준다 → 그 필터는 조용히 무시된다
    apply_structural_filters:
      역할: "스케줄에 저장된 필터 전부를 쿼리에 적용하는 정문. 표준 발송과 표준 칩이 이 한 곳을 공유한다"
      등급: D
      핵심: true
      주의: |
        · 구역 조건 여러 개는 **OR**, 칸 조건 여러 개는 **AND**, 둘 사이는 AND. 이 결합 규칙이 핵심
        · ★ 액티비티 격리 — 스케줄이 액티비티를 **명시적으로** 대상에 넣지 않았으면(필터가 비어
          있어도) 액티비티 손님을 자동으로 뺀다. 표준 발송과 표준 칩이 같은 지점을 지나므로
          여기 한 곳으로 격리가 보장된다. 이벤트 경로는 이 필터를 안 타므로 별도 가드가 필요
        · 후보 사전추림 모드에서는 날짜에 의존하는 칸 조건(파티차수·메모)을 건너뛴다
        · 모르는 필터 항목은 조용히 무시된다
