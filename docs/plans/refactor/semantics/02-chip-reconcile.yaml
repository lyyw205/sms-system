# 칩 정합 — "지금 이 예약에 어떤 문자 칩이 있어야 하는가"를 계산해서 실제와 맞추는 곳.
# 칩 = "이 손님에게 / 이 날짜에 / 이 문자를 보낼 예정" 이라는 기록.

- module: services/chip_reconciler.py
  fns:
    reconcile_chips_for_reservation:
      역할: "예약 하나를 기준으로, 모든 활성 스케줄을 훑어 '있어야 할 칩'을 계산하고 실제와 맞춘다 (없으면 만들고, 필요 없으면 지움)"
      등급: D
      핵심: true
      주의: |
        · 취소된 예약은 **기존 미발송 칩만 정리하고 새 칩은 안 만든다**. 여기서 빠져나가는 게 중요
        · 세션 테넌트와 예약 테넌트가 다르면 중요 로그만 남기고 계속 진행한다 — 막지 않는 이유는
          정상 정리까지 막힐 수 있어서. 즉 유령 칩이 생길 여지가 남아있고 로그가 유일한 단서
        · 스케줄을 직접 조회할 때 예약의 테넌트로 명시 필터를 건다. 자동 테넌트 필터가 우회
          상태로 새면 다른 테넌트 스케줄이 섞여 엉뚱한 칩이 생기기 때문 (이중 방어)
        · 호출자가 스케줄 목록을 넘겨줘도 테넌트가 다른 건 걷어낸다
        · event / custom_schedule 종류는 여기서 칩을 안 만든다 (각자 다른 경로)
        · 템플릿이 없거나 비활성인 스케줄은 건너뜀
        · 커스텀 스케줄이 만든 칩은 비교 대상에서 제외한다 — 안 그러면 남의 칩을 지운다
        커밋하지 않는다 (트랜잭션은 호출자 소유)
    reconcile_chips_for_schedule:
      역할: "스케줄 하나를 기준으로, 대상이 되는 모든 예약의 칩을 계산해서 맞춘다 (스케줄을 만들거나 고쳤을 때)"
      등급: D
      핵심: true
      주의: |
        · 스케줄이나 템플릿이 비활성이면 **자기가 만든 칩만** 지우고 끝낸다
        · 비교 범위(scope_dates)를 필터 통과 여부와 무관하게 먼저 넓게 잡는다. 안 그러면
          '더는 대상이 아닌 날짜' 의 낡은 칩이 안 지워지고 남는다
        · ★ 비교 대상 조회에 반드시 예약 id 필터가 들어가야 한다. 없으면 우연히 같은 날짜를
          쓰는 **다른 예약의 칩까지 지워버린다**
        · 후보가 하나도 없으면 조건이 False 가 되어 아무것도 조회되지 않는다
    _reservation_matches_schedule:
      역할: "이 예약이 그 날짜에 이 스케줄의 조건(구역·건물·객실·컬럼일치 등)을 통과하는지 판정"
      등급: D
      핵심: true
      주의: "실제로 DB 쿼리를 날려서 판정한다 — 필터 로직을 파이썬으로 복제하지 않고 SQL 을 단일 진실로 쓰는 방식"
    _get_candidate_reservations:
      역할: "스케줄 하나에 대해, 날짜와 무관한 조건만으로 후보 예약을 먼저 추린다 (건물·객실·컬럼일치는 날짜별로 뒤에서 다시 검사)"
      등급: D
      핵심: true
      주의: |
        · 확정 상태만 대상
        · **안전장치: 체크인이 오늘 기준 -7일 ~ +1일 범위 안**인 예약만. 이 범위를 벗어난 예약에
          칩이 생기면 나중에 발송 단계의 안전장치에 걸려 영영 안 나가는 좀비 칩이 된다
        · 첫밤 모드면 체크인 == 대상일 로 좁힌다. 마지막밤은 여기서 안 좁히고 발송 시점에 거른다
        · 연박 제외 옵션이면 연박자를 뺀다
    _sync_chips:
      역할: "예약 하나에 대해 '있어야 할 칩' 과 '실제 칩' 을 비교해 만들고 지운다"
      등급: D
      핵심: true
      주의: |
        운영자가 '발송 제외'(excluded) 표시한 칩은 **다시 만들지 않는다** — 지우는 쪽 보호와
        별개로, 만드는 쪽에서도 막아야 매번 부활하지 않는다.
        삭제는 chip_store 에 위임하므로 발송완료·수동·실패 칩은 자동 보호된다.
    _sync_chips_for_schedule:
      역할: "스케줄 하나에 대해 여러 예약의 칩을 비교해 만들고 지운다"
      등급: D
      핵심: true
      주의: |
        생성 개수를 세기 위해 만들기 **전에** 이미 있는지 따로 조회한다. ensure_chip 이
        (예약,템플릿,날짜) 로 매칭하다 보니, 같은 템플릿을 쓰는 다른 스케줄의 칩이 있으면
        그걸 반환할 뿐 새로 안 만들기 때문. 이 사전 조회를 빼면 카운트가 틀어진다.
        여기서 만드는 칩은 assigned_by='schedule' (예약 기준 경로는 'auto') — 값이 다르다.
