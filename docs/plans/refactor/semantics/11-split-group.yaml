# 분할 그룹 정합 가드 — 네이버가 '객실 3개' 를 한 건으로 보내 우리가 3행으로 쪼갠 뒤,
# 원본이 취소되거나 개수가 바뀌었을 때 형제 행들이 어긋나지 않게 감시하는 곳.
# 기본은 **경보만** 하고 데이터를 안 바꾼다. 자동 취소는 설정으로 켜야 동작한다.

- module: services/split_group_guard.py
  fns:
    _kst_day_start_utc:
      역할: "오늘 한국시간 자정을 UTC 로 환산 (활동로그 시각 비교용)"
      등급: I
    _alerted_today:
      역할: "오늘 같은 종류·같은 대상으로 이미 경보를 냈는지 확인 (하루 1회 제한)"
      등급: G
      핵심: true
      주의: "5분마다 도는 동기화가 같은 경보를 하루 종일 쏟아내는 걸 막는 장치. 활동로그 detail 문자열을 LIKE 로 검색한다"
    find_confirmed_siblings:
      역할: "같은 분할 그룹에서 아직 확정 상태로 남아있는 형제 행들을 찾는다"
      등급: D
      핵심: true
      주의: "테넌트 컨텍스트 없으면 예외. **명시 테넌트 필터**로 이중 방어한다. `min_checkout` 을 주면 체크아웃이 그 날 이후인 것만 — 체크아웃이 없으면 체크인으로 폴백"
    _group_row_count:
      역할: "그 분할 그룹의 총 행 수를 센다 — **취소된 것도 포함**"
      등급: D
      핵심: true
      주의: "★ 살아있는 행만 세면 정리 직후부터 영구 오탐이 난다. 네이버가 취소건도 조회 기간 동안 계속 재전송하기 때문. 이 '취소 포함' 이 핵심 설계 결정이다"
    _sent_chip_count:
      역할: "이 예약에 이미 발송된 문자 칩이 몇 개인지 센다 (경보에 심각도 정보로 포함)"
      등급: I

    alert_cancel_orphan:
      역할: "대표 예약이 취소됐는데 형제가 아직 확정으로 남아있으면 운영자에게 알린다"
      등급: G
      핵심: true
      주의: |
        · **데이터를 절대 바꾸지 않는다** — 경보만. 상태·배정·칩 전부 그대로
        · 중복 방지 마커에 JSON 경계를 포함시킨다 (`"split_group_id": "nsplit-77"`).
          그냥 `nsplit-77` 로 하면 `nsplit-777` 에도 걸린다
        · `dedup=True` 는 자동 경로(동기화·일일 점검)용 — 하루 1회.
          `dedup=False` 는 운영자가 직접 삭제·취소한 경우 — 즉시 발화
        · 이미 발송된 칩 수를 함께 기록한다 (문자가 나간 뒤면 더 심각하므로)

    alert_bc_drift:
      역할: "네이버가 알려준 객실 개수와 우리 시스템의 행 수가 다르면 알린다"
      등급: G
      주의: "대표가 확정 상태일 때만 발화 — 취소된 그룹의 불일치는 노이즈. 하루 1회 제한"

    alert_unsplit_multi:
      역할: "분할이 적용 안 된 일반실 예약의 객실 개수가 1에서 N으로 바뀐 걸 감지해 알린다"
      등급: G
      핵심: true
      주의: |
        ★ 이건 **조용히 손실되던 경로**를 드러내는 경보다. 재분할을 안 하는 규칙 + 동결 규칙이
        겹쳐서, 추가 결제된 객실이 아무 흔적 없이 사라지던 사고를 가시화한 것.
        · 자동 처리는 위험해서 감지·경보만 한다
        · ★ '분할은 됐는데 그룹 키만 없는' 경우와 '진짜 분할 미적용' 을 구분한다.
          6개 필드(이름·전화·체크인·체크아웃·상품·출처)로 형제 행 존재를 확인해서 분기.
          이걸 구분 안 하면 운영자가 객실을 수동으로 또 만들어 **중복 예약**이 된다
        · 마커에 후행 콤마를 붙인다 (`"reservation_id": 7,`) — id 7 이 77 에 걸리지 않게

    _propagated_before:
      역할: "이 그룹에 자동 취소 전파가 이미 실행된 적 있는지 확인 — **전 기간** 조회"
      등급: G
      핵심: true
      주의: "하루 단위가 아니라 영구 기록이다. 운영자가 전파 후 형제를 일부러 되살렸을 때, 다음 동기화가 또 취소하는 걸 막는다. 정리 스크립트가 남긴 기록도 함께 본다"

    _protection_signals:
      역할: "이 형제 행에 운영자 개입 흔적이 있는지 전부 모은다. 하나라도 있으면 자동 취소를 금지"
      등급: G
      핵심: true
      주의: |
        **과보호가 안전한 방향**이라는 원칙으로 신호를 넓게 잡는다.
        · 운영자 편집 기록(어떤 필드든) · 체크인/체크아웃 잠금 · 연장 표시 · 성별 수동 편집
        · 수동으로 배정된 방 · 보호 대상 미발송 칩(수동/제외/실패)
        이름·전화 편집만 보면 부족하다 — 체류 연장처럼 '실제로 묵을 의도가 명백한' 형제를
        자동 취소해버리기 때문.

    propagate_cancel:
      역할: "대표 취소를 형제들에게 자동 전파한다 (설정으로 켜야 동작, 기본은 꺼짐)"
      등급: G
      핵심: true
      순서: "보호신호 검사 → 상태·취소시각 복사 → 취소 후처리(배정 해제·미발송 칩 삭제) → 수동 연박그룹이면 해제 + 남은 멤버 칩 재계산"
      주의: |
        · 대표가 **실제로 취소 상태여야** 전파한다. '잠금은 있는데 확정' 같은 모순 상태에서는
          경보로 강등 (동기화 쪽의 '자동 보정 위험' 판단과 같은 패턴)
        · 형제마다 SAVEPOINT 로 격리 — 한 명 실패가 동기화 전체를 죽이지 않게
        · **체크아웃이 오늘 이후인 형제만** 전파한다. 과거 체류분은 발송·배정 위험이 없고,
          과거 이력을 소급 삭제하면 안 되기 때문
        · 취소시각을 명시 복사한다 — 안 하면 취소 목록 화면에 안 나타난다
        · 그룹당 1회 기록을 남겨 재전파를 막는다
        · 건너뛴 형제나 실패한 형제가 있으면 즉시 경보(중복 억제 없이)

    alert_reactivated_orphan:
      역할: "취소했던 대표를 되살렸는데 형제가 아직 취소 상태로 남아있으면 알린다"
      등급: G
      주의: |
        ★ **자동 복구는 하지 않는다** — 라이프사이클에 '배정·칩 복구' 이벤트가 아예 없어서
        되살릴 방법이 없다. 경보만.
        ★ 트리거가 **상태 전이 기반**(취소→확정)이다. 현재 상태만 보면 '운영자가 형제만
        일부러 취소해둔 정상 상태' 를 영원히 경보하게 된다.

    sweep_orphan_groups:
      역할: "매일 09:43 에 도는 마지막 그물. 취소된 대표 × 살아있는 형제 조합을 전수 점검"
      등급: D
      핵심: true
      주의: |
        동기화 경보는 네이버 조회 기간(등록일 1일 + 이용일 오늘~내일)을 벗어난 취소를 놓친다.
        이 점검이 그걸 잡는다.
        중복 억제를 동기화 경보와 **공유**하므로 같은 날 두 번 알리지 않는다.
        체크아웃이 오늘 이후인 형제만 대상 — 게이트와 경보 내용의 기준을 맞춘 것.
