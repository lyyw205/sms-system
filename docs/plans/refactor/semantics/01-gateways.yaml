# 관문(게이트웨이) 모듈 — "이 데이터를 바꾸려면 반드시 여기를 지나라" 는 자리.
# 현재 강제되는 건 테넌트뿐이고 나머지는 약속이다. 코어 후보 최상위.

- module: services/chip_store.py
  fns:
    ensure_chip:
      역할: "문자 칩을 만든다. 이미 있으면 그대로 돌려주므로 몇 번을 불러도 안전(멱등)"
      등급: G
      핵심: true
      주의: |
        같은 칩인지 판단하는 기준은 (예약, 템플릿, 날짜) 3개.
        동시에 두 곳에서 같은 칩을 만들려 하면 DB 유니크 제약이 걸리는데, SAVEPOINT 로 감싸고
        충돌하면 다시 조회해서 돌려준다. 이 재조회마저 비면 비정상이라 중요 로그를 남긴다.
        기존 칩의 schedule_id 는 갱신하지 않는다 — 신규 생성 때만 붙는다.
    remove_chip:
      역할: "문자 칩 1개를 지운다. 단, 지우면 안 되는 칩은 보호한다"
      등급: G
      핵심: true
      주의: |
        보호 규칙(force=False 기본):
          · 이미 발송된 칩(sent_at 있음)은 절대 안 지움
          · 운영자가 손댄 칩(manual/excluded/failed)은 안 지움
          · 옛 데이터 호환 — assigned_by='auto' 인데 send_status='failed' 인 것도 보호
        찾는 기준이 두 갈래다. schedule_id 가 있으면 (예약,스케줄,날짜)로, 없으면
        (예약,템플릿,날짜) + schedule_id 가 NULL 인 것만. 평일/주말 스케줄이 같은 템플릿을
        쓸 때 한쪽만 정리하려고 이렇게 나뉘어 있다 — 합치면 남의 칩을 지운다.
    delete_chips_for_reservation:
      역할: "한 예약의 칩을 범위로 지운다. 날짜·템플릿·스케줄 조건을 겹쳐 쓸 수 있음(AND)"
      등급: G
      핵심: true
      주의: "조건을 아무것도 안 주면 그 예약의 칩 전부가 대상. force=True 면 보호를 우회하는데, protect_sent 는 따로 조절된다 — 취소는 발송이력 보존(True), 삭제는 발송이력까지 제거(False)"
    delete_chips_for_template:
      역할: "템플릿 하나에 딸린 칩을 전 예약에서 일괄 삭제 (템플릿 비활성/삭제 시)"
      등급: G
    delete_chips_for_schedule:
      역할: "스케줄 하나에 딸린 칩을 일괄 삭제 (스케줄 비활성/삭제 시)"
      등급: G
      주의: "테넌트 필터는 자동으로 걸린다. 테넌트를 넘나드는 정리가 필요하면 호출자가 우회를 책임져야 함"
    _resolve_reservation_tenant:
      역할: "이 예약이 진짜 어느 테넌트 것인지 확인하고, 지금 세션의 테넌트와 다르면 즉시 경보"
      등급: G
      핵심: true
      주의: |
        테넌트 필터를 잠깐 끄고 조회한다 — 같은 트랜잭션 안에서 아직 커밋 안 된 데이터도
        봐야 하기 때문. try/finally 로 반드시 원복한다. 별도 세션을 쓰면 트랜잭션 격리 때문에
        안 보여서 이 방식을 택한 것이므로, 재작성 시 "깔끔하게 세션 분리" 로 바꾸면 깨진다.
        예약이 없으면 RuntimeError 를 던진다 (조용히 넘어가지 않음).
    record_sent:
      역할: "문자 발송 성공을 칩에 기록. 칩이 없으면 새로 만들어서라도 흔적을 남긴다"
      등급: D
      핵심: true
      주의: "칩이 없는 발송(이벤트 문자, 외부 발송, 경합)도 정상 흐름으로 보고 새 칩을 만든다. 실패 기록이 있었다면 send_error 를 지운다"
    record_failed:
      역할: "문자 발송 실패를 칩에 기록"
      등급: G
      핵심: true
      주의: |
        기존 칩이 'auto' 였어도 assigned_by 를 'failed' 로 승격시킨다. 그래야 다음 자동
        정리에서 보호 대상이 되어 실패 흔적이 살아남는다. 옛 코드는 승격을 안 했고, 이건
        의도된 변경이다. 에러 메시지는 500자로 자른다.

- module: services/reservation_mutator.py
  fns:
    ReservationMutator.apply_changes:
      역할: "예약 필드를 바꾸는 유일한 정문. 누가(네이버/직원/시스템) 어떤 필드를 바꿀 수 있는지 권한표로 검사한 뒤에만 적용한다"
      등급: G
      핵심: true
      주의: |
        네 단계로 동작한다.
        (1) 정규화 — check_out_date 가 빈 문자열이면 None 으로. 이걸 안 하면 빈 문자열이
            '변경됨' 으로 판정되어 잠금이 영구히 박히고 네이버가 영영 못 고친다
        (2) 액티비티 잠금 — 이미 '액티비티' 인 예약을 객실/파티/미배정/언스로 바꾸는 건
            출처 불문 거부. 여기는 PATCH·네이버 경로만 담당하고, 직접 대입 경로는 다른 곳이 막음
        (3) 권한 평가 — 표에 없는 필드는 무조건 통과(allow-all). never 면 거부하고 중요 로그.
            guarded 면 잠금 여부를 본다. 잠금 확인이 두 가지 병행 — 옛 pin 컬럼과 새 방명록 dict
        (4) 직원 변경 자동 표시 — 실제로 바뀐 게 있으면 날짜 잠금 컬럼을 켜고,
            방명록에 필드별 타임스탬프를 남긴다. 단 네이버 기준 guarded 인 필드만
        값이 안 바뀌면 반환값에 안 담긴다. 호출자는 이 반환값으로 '진짜 뭐가 바뀌었나' 를 판단한다.
        JSON dict 는 반드시 새 dict 를 할당해야 SQLAlchemy 가 변경을 감지한다 — 제자리 수정하면 저장 안 됨.
    ReservationMutator.release_manual_pin:
      역할: "직원이 걸어둔 잠금을 푼다. 방명록 dict 와 옛 pin 컬럼 둘 다 해제"
      등급: G
      핵심: true
      주의: "취소·연박취소처럼 '이제 자동 동기화로 돌아가라' 는 의도에서만 호출. 실제로 하나라도 풀렸을 때만 중요 로그를 남긴다"

- module: services/reconcile.py
  fns:
    reconcile_all_chips:
      역할: "예약 하나의 문자 칩 5종을 한 번에 전부 다시 계산한다. 예약이 바뀐 뒤 이것만 부르면 칩이 일관된 상태가 된다"
      등급: D
      핵심: true
      주의: |
        5종을 각각 try/except 로 감싸서 하나가 실패해도 나머지는 계속한다 — 즉 조용히 일부만
        반영될 수 있고, 경고 로그가 유일한 단서다.
        날짜를 안 주면 투숙 전 기간을 대상으로 한다.
        ⚠️ 전제조건: 객실 배정(RoomAssignment)이 이미 최신이어야 한다. 배정 정리는 다른
        함수(_reconcile_dates)가 하고, 이 함수는 그 다음에 불려야 한다. 순서가 뒤집히면
        낡은 배정 기준으로 칩이 만들어진다.
        일반 칩(sync_sms_tags)은 날짜 루프 밖에서 1번, 나머지 4종은 날짜마다 1번씩 돈다.

- module: services/reservation_lifecycle.py
  fns:
    on_dates_changed:
      역할: "체크인/체크아웃이 바뀐 직후 따라와야 할 뒷정리를 정해진 순서로 실행"
      등급: D
      핵심: true
      순서: "① 날짜별 기록 평행이동 → ② 배정 정리(범위 밖 삭제·누락 추가·밀어내기) → ③ 칩 5종 재계산. 이 순서가 뒤집히면 낡은 배정 기준으로 칩이 만들어진다"
      주의: "호출자가 새 날짜를 이미 적용한 뒤에 불러야 한다. 옛 날짜는 인자로 넘겨줘야 평행이동 계산이 가능"
    on_constraints_changed:
      역할: "인원·성별이 바뀐 직후, 기존 객실 배정이 여전히 유효한지 검사하고 위반이면 해제"
      등급: G
      핵심: true
      주의: |
        검사 자체가 실패하면 '위반 없음' 으로 간주하고 넘어간다(경고 로그만) — 조용히 통과할 수 있음.
        해제 대상은 **오늘 이후 날짜만**. 과거·오늘 배정은 손대지 않는다.
        해제 시 활동로그 + 중요 진단로그를 남긴다.
        마지막에 칩 5종을 재계산한다.
    on_status_cancelled:
      역할: "예약이 취소된 직후 배정과 칩을 정리. 당일 취소와 사전 취소가 다르게 동작"
      등급: G
      핵심: true
      주의: |
        당일 취소: 오늘 이후 배정만 해제하고 예약행의 객실번호/비번을 비운다. 이미 정리된
          예약이면 아무것도 안 한다(멱등 가드) — 5분마다 도는 동기화가 헛일하는 걸 막는 장치
        사전 취소: 전체 배정을 통째로 해제
        공통: 미발송 칩은 운영자가 손댄 것까지 전부 지우되(force=True), **발송 완료 이력은 보존**(protect_sent=True)
        연박그룹 해제와 남은 멤버 칩 재계산은 이 함수 책임이 아니다 — 호출자가 해야 함
    on_room_assigned:
      역할: "객실 배정 직후, 본인 칩과 '밀려난 사람들' 칩을 모두 재계산"
      등급: D
      핵심: true
      주의: "밀려난 예약이 중복으로 올 수 있어 id 로 중복 제거한다"
    on_reservation_deleted:
      역할: "예약 행을 진짜로 지우기 직전, 딸린 데이터를 전부 정리 (배정·칩·날짜별정보·파티체크인)"
      등급: D
      핵심: true
      주의: "예약이 사라지므로 발송 이력 칩까지 지운다(protect_sent=False) — 취소와 다른 점. 예약행 삭제·연박그룹 해제·커밋은 호출자 책임"
