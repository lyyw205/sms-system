# 연박 그룹 — 손님이 하루씩 따로 예약한 걸 "이어진 숙박" 으로 묶는 곳.
# 묶여야 문자가 중복 안 나가고, 같은 방을 계속 쓰고, 마지막 밤 안내가 제대로 간다.

- module: services/consecutive_stay.py
  fns:
    compute_is_long_stay:
      역할: "이 예약이 '연박자' 인지 판정 — 연박그룹에 속했거나, 2박 이상이면 연박자"
      등급: D
      핵심: true
      주의: "연장 리팩토링 이후 '한 행에 여러 날' 인 예약은 그룹 없이 날짜 차이로만 잡힌다. 날짜 파싱 실패는 False"

    detect_and_link_consecutive_stays:
      역할: "같은 사람이 연속된 날짜로 따로 예약한 걸 찾아 하나의 연박 그룹으로 묶는다. 하루 4회 + 동기화 직후 실행"
      등급: D
      핵심: true
      주의: |
        · 테넌트 컨텍스트 없으면 예외
        · **스캔 범위를 좁혀놨다** — 체크아웃이 오늘 이후이고 체크인이 5일 이내인 예약만.
          과거는 감지해도 배정·문자에 반영될 일이 없고, 먼 미래는 가까워지면 다음 주기에 잡힌다.
          ★ 범위 밖 예약의 기존 그룹은 스캔에 안 잡히므로 **그대로 보존**된다 — 이 점을 놓치면
          범위를 넓혔을 때 과거 그룹이 대량 해제된다
        · **분할 형제(naver_split)는 후보에서 제외**한다. 같은 이름·전화라 다음날 진짜 예약과
          가짜 체인을 만들어 대표가 그룹에서 누락되는 심각한 사고가 났었다
        · 운영자가 손으로 뗀 예약(stay_group_excluded)은 자동 재묶기에서 영구 제외
        · **동일인 판정이 3가지 키** — (이름,전화) / (방문자명,전화) / (이름,방문자전화).
          느슨하게 잡은 뒤, 예약을 공유하는 그룹들을 합쳐서 하나로 만든다
        · 그룹 안에서 '앞 예약의 체크아웃 == 뒤 예약의 체크인' 인 것만 연속 체인으로 인정
        · 기존 그룹 id 가 하나라도 있으면 **그걸 재사용**한다 (id 가 매번 바뀌지 않게)
        · 더 이상 연속이 아닌 예약은 그룹에서 뺀다. 단 **`manual-` 로 시작하는 수동 그룹은
          건드리지 않는다** — 운영자가 직접 묶은 건 자동으로 못 푼다
        멱등이라 몇 번을 돌려도 안전하다.

    unlink_from_group:
      역할: "예약 하나를 연박 그룹에서 뺀다. 남은 멤버 순번을 다시 매기고, 한 명만 남으면 그룹을 해산"
      등급: D
      핵심: true
      주의: |
        · `exclude_from_auto_link=True` 는 **운영자가 직접 뗀 경우에만** 써야 한다.
          이걸 켜면 자동 재묶기에서 영구 제외된다. 시스템 자동 해제(네이버 동기화, 연쇄 처리)는
          기본값 False 를 써야 나중에 다시 묶일 수 있다
        · 남은 사람이 1명 이하면 그룹 자체를 해산한다 (혼자 남은 그룹은 의미 없음)
        · 순번과 '마지막 멤버' 표시를 다시 계산한다 — 이게 마지막밤 문자 대상 판정에 쓰인다
        중요 진단로그를 남긴다.

    _validate_link_inputs:
      역할: "수동 연박 묶기가 가능한 조합인지 검증. 안 되면 사유와 함께 거부"
      등급: G
      핵심: true
      주의: |
        거부 조건 4가지 — 2건 미만 / 확정 아닌 게 섞임 / **액티비티 포함** / 날짜가 안 이어짐.
        액티비티는 숙박 개념이 없어서(체크아웃 NULL) 묶으면 가짜 연박이 되고 칩 날짜가 왜곡된다.
        '이어짐' 판정이 두 갈래다.
          (a) 앞 예약 체크아웃 == 뒤 예약 체크인 (표준)
          (b) 앞 예약 체크아웃이 비었고 체크인+1일 == 뒤 체크인 (수동 입력 1박 호환)
        (b) 를 빼면 손으로 만든 1박 예약을 못 묶는다.

    link_reservations:
      역할: "운영자가 고른 예약들을 손으로 연박 그룹으로 묶는다"
      등급: D
      핵심: true
      주의: |
        · **기존 그룹 멤버를 자동으로 끌어온다**. 운영자가 3명 중 2명만 골라도 나머지 1명이
          외톨이로 남지 않게 하는 장치. 단 확정 상태만 끌어온다
        · **항상 새 `manual-` UUID 를 만든다**. 자동 그룹과 격리해서 자동 해제가 못 건드리게 하려는 것
        · 자동 재묶기 제외 표시가 걸려 있던 예약은 해제하고, 그 사실을 중요 로그로 남긴다
        반환값에 **자동 확장 후 전체 멤버 id** 가 들어있다. 호출자는 이 목록 기준으로 칩 재계산을 해야 한다.
