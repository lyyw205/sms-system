# 테넌트 설정(네이버 쿠키) · 문자 템플릿 관리 · 인증/사용자 관리.
# 쿠키 오입력 사고가 반복돼서 검증·감사 장치가 겹겹이 들어가 있다.

- module: api/settings.py
  fns:
    _client_ip:
      역할: "요청자 IP 를 알아낸다 (프록시 뒤면 X-Forwarded-For 우선)"
      등급: I
    _cookie_fingerprint:
      역할: "쿠키 전문을 저장하지 않고 길이·마스킹 미리보기·해시 앞자리만 남긴다"
      등급: G
      핵심: true
      주의: "★ 12자 이하 짧은 값은 **원문 그대로 노출**한다 — 'NAC' 나 '.' 같은 오입력을 진단하려면 원문이 필요하기 때문. 긴 값은 앞6+뒤4만"
    _validate_naver_cookie:
      역할: "네이버 쿠키 형식 검증 — 저장 전 관문"
      등급: G
      핵심: true
      주의: |
        ★ **실제 오입력 사고(7/10 3회)에서 나온 방어**다.
        · 50자 미만 거부 — 정상 쿠키는 수백~1천여 자. 'NAC'(3자) 나 '.'(1자) 류를 막는다
        · `=` 가 없으면 거부 (키=값 쌍이 아님)
        거부 사유를 문자열로 함께 돌려줘서 로그와 사용자 메시지에 그대로 쓴다.
    _audit_cookie_change:
      역할: "쿠키 변경 시도를 전부 감사로그에 남긴다 — 수락이든 거부든"
      등급: G
      핵심: true
      주의: "누가·언제·어느 IP·어떤 값(지문)·수락여부·거부사유를 남긴다. 감사 실패는 경고만 남기고 롤백 — 본 작업을 막지 않는다"
    get_naver_status:
      역할: "현재 쿠키 상태를 보여주고 실제로 네이버를 호출해 유효한지 검사한다"
      등급: D
      주의: "★ 테넌트 자기 설정만 본다 — 전역 설정으로 폴백하지 않는다. 검증 실패는 `is_valid=False` 로 표시만"
    update_naver_cookie:
      역할: "네이버 쿠키를 저장한다. 검증 통과분만"
      등급: G
      핵심: true
      순서: "공백 정리 → 형식 검증(실패 시 저장 안 함) → 저장 → 감사로그 → 실제 호출 검증"
      주의: |
        · 개행·탭·연속 공백을 하나로 정리한다 (브라우저 복사 시 섞여 들어옴)
        · ★ 검증 실패 시 **저장하지 않고** 거부 로그만 남긴 뒤, 사용자에게 사유와
          "브라우저에서 전체 쿠키를 다시 복사해 주세요" 안내를 돌려준다
        · ⚠️ 테넌트 객체가 **다른 세션**에서 왔기 때문에, 그 세션을 직접 찾아 커밋한다.
          요청 세션에 커밋하면 반영이 안 된다 — 재작성 시 놓치기 쉬운 함정
        · 저장 후 실제 호출 검증이 실패해도 **저장은 성공**으로 응답한다 (경고만 첨부)
    clear_naver_cookie:
      역할: "쿠키를 지운다 (감사로그 포함)"
      등급: G
    get_unstable_status:
      역할: "언스테이블 계정 상태 조회 + 유효성 검사"
      등급: D
    update_unstable_settings:
      역할: "언스테이블 사업장 id·쿠키를 저장한다"
      등급: G
      주의: "쿠키 검증·감사·세션 커밋 방식이 위 네이버 쿠키와 동일하다 — **거의 같은 코드가 두 벌** 존재. 통합 후보. 빈 값이면 검증을 건너뛰고 NULL 로 지운다"
    sync_unstable_reservations:
      역할: "언스테이블 동기화를 즉시 실행"
      등급: I
    get_highlight_colors:
      역할: "예약 카드 강조색 목록 조회"
      등급: I
    update_highlight_colors:
      역할: "강조색 목록 저장"
      등급: I

- module: api/templates.py
  fns:
    _validate_lms_title:
      역할: "LMS 제목이 알리고 제한(30바이트)을 넘는지 검증"
      등급: G
      주의: "EUC-KR 기준(한글 2바이트, 약 14자). 인코딩 불가 문자가 있으면 UTF-8 로 폴백해 **더 큰 값**을 쓴다(보수적). 빈 문자열은 NULL 로 정규화"
    get_templates:
      역할: "템플릿 목록 조회"
      등급: I
    get_template_labels:
      역할: "칩 표시용 템플릿 라벨 목록. **표시 순서를 계산**해서 돌려준다"
      등급: D
      핵심: true
      주의: |
        정렬 규칙이 3단계다.
        ① 테넌트가 지정한 우선순위 키 — 그 배열 순서대로 맨 앞에 고정. 설정이 없으면
           기본 3종(파티안내·객실안내·보조객실안내)
        ② 나머지는 **하루 안에서 실제 발송 시각 순**. 여기서 날짜 오프셋까지 계산한다 —
           예약일 당일(0) / 다음날 발송(+1, 후기류) / 전날 발송(−1, 사전안내류).
           정렬값 = 오프셋×1440 + 시×60 + 분. 한 템플릿에 스케줄이 여러 개면 가장 이른 값
        ③ 시각을 모르는 것(스케줄 미연결·간격·이벤트)은 맨 뒤, 같으면 키 알파벳순
    get_template:
      역할: "템플릿 단건 조회"
      등급: N
    create_template:
      역할: "템플릿 생성"
      등급: D
    update_template:
      역할: "템플릿 수정"
      등급: D
    reorder_templates:
      역할: "드래그로 바꾼 템플릿 순서를 일괄 저장"
      등급: G
      주의: "객실 순서와 동일 — **전체 id 와 정확히 일치**해야 하고 중복·누락 모두 거부"
    delete_template:
      역할: "템플릿 삭제"
      등급: G
      핵심: true
      주의: |
        ★ **연결된 스케줄이 하나라도 있으면 거부**한다. 스케줄의 템플릿 참조가 NOT NULL 이라
        그냥 지우면 DB 제약 위반으로 터진다. 활성·비활성 개수를 세어 "활성 2개, 비활성 1개"
        처럼 알려준 뒤 먼저 지우라고 안내한다.
    preview_template:
      역할: "샘플 변수로 렌더링 결과를 미리 보여준다"
      등급: I
      주의: "본문에서 쓰인 변수 목록도 정규식으로 뽑아 함께 돌려준다. 렌더링 실패는 400"
    get_available_variables:
      역할: "사용 가능한 템플릿 변수 목록 + 분류"
      등급: I

- module: api/auth.py
  fns:
    login:
      역할: "로그인 — 토큰 2종 발급 + 접근 가능한 테넌트 목록 반환"
      등급: G
      핵심: true
      주의: |
        · 분당 5회 제한 (무차별 대입 방어)
        · ★ 아이디가 없는 것과 비밀번호가 틀린 것의 **에러 메시지가 같다** — 계정 존재
          여부가 노출되지 않게. 다만 **비활성 계정은 별도 메시지**라 여기서는 노출된다
        · SUPERADMIN 은 전 테넌트, 나머지는 매핑된 테넌트만
    refresh_token:
      역할: "갱신 토큰으로 새 토큰 2종을 발급"
      등급: G
      주의: "만료와 그 외 오류의 메시지를 구분한다. 비활성 사용자면 거부. **갱신 토큰도 새로 발급**한다(회전)"
    get_me:
      역할: "내 정보 + 접근 가능한 테넌트 목록"
      등급: I
    list_users:
      역할: "사용자 목록 조회"
      등급: I
    create_user:
      역할: "사용자 생성"
      등급: G
      핵심: true
      주의: |
        ★ 권한 규칙이 겹겹이다.
        · ADMIN 은 **STAFF 만** 만들 수 있다
        · SUPERADMIN 계정은 **아무도** 못 만든다
        · ADMIN 은 자기가 접근 가능한 테넌트에만 만들 수 있다 (헤더 필수)
        · 생성 후 현재 테넌트에 자동 매핑
    update_user:
      역할: "사용자 수정"
      등급: G
      주의: "ADMIN 은 **같은 테넌트 소속 사용자만** 수정 가능"
    delete_user:
      역할: "사용자 삭제"
      등급: G
