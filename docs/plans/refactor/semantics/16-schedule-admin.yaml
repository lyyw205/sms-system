# 스케줄 등록·관리 — DB 스케줄 레코드를 APScheduler 잡으로 배선하고, 운영자가 CRUD 하는 곳.

- module: scheduler/schedule_manager.py
  fns:
    ScheduleManager.__init__:
      역할: "APScheduler 인스턴스를 받아 관리자 생성"
      등급: I
    ScheduleManager.sync_all_schedules:
      역할: "DB의 활성 스케줄을 전부 APScheduler 에 다시 올린다 (기동 시 · 비상 복구용)"
      등급: I
      주의: "개별 실패는 로그만 남기고 다음 스케줄로 넘어간다"
    ScheduleManager.add_schedule_job:
      역할: "스케줄 하나를 APScheduler 잡으로 등록한다. 실행 함수까지 여기서 만든다"
      등급: G
      핵심: true
      순서: "1단계: 우회 세션으로 스케줄 메타 조회(만료·활성시간 검사) → 2단계: 테넌트 세션으로 실제 실행"
      주의: |
        · ★ 스케줄 **id 만 캡처**한다. ORM 객체를 클로저에 담으면 나중에 세션이 끊겨 detached 오류가 난다
        · ★ 실행 시점에 **2단계로 세션을 나눈다**. 어느 테넌트인지 알아야 테넌트 세션을 열 수 있는데,
          그 정보 자체가 DB에 있어서 먼저 우회 세션으로 읽는다
        · ★ 스케줄을 못 찾아도 **잡을 스스로 지우지 않는다**. 일시적 DB 오류인지 진짜 삭제인지
          코드가 구분 못 해서 잡을 영구히 잃을 위험이 있다. 경보만 반복하고 사람이 판단한다
        · 만료 시각이 지났으면 비활성화하고 잡을 제거한다
        · 활성 시간대 검사 — 시작<종료면 그 사이만, 시작>종료면 자정을 넘는 구간으로 해석
        · 잡 옵션: 놓친 실행이 쌓여도 **1번만 따라잡고**(coalesce), 60초 이내 지연은 허용,
          **동시 실행 1개로 제한**(중복 발송 방지)
    ScheduleManager.remove_schedule_job:
      역할: "APScheduler 에서 잡을 제거"
      등급: I
    ScheduleManager.update_schedule_job:
      역할: "잡을 제거 후 다시 등록 (설정 변경 시)"
      등급: I
    ScheduleManager._create_trigger:
      역할: "스케줄 설정을 APScheduler 트리거로 변환한다"
      등급: D
      핵심: true
      주의: |
        4가지 타입이 각각 다르게 만들어진다.
        · 매일 / 매주 / 매시 — 크론 트리거. 주간은 요일이 없으면 실패(None 반환)
        · **간격**이 가장 복잡하다:
            - 60분 미만 → `분=*/N` 크론. 활성 시간대를 시 범위로 넣는다
            - 60의 배수 → `시=시작-종료/N` 크론
            - **그 외(예: 90분) → 간격 트리거**. 이 경우 활성 시간대를 트리거로 표현할 수 없어서,
              실행 함수 안의 런타임 검사가 대신 막는다
        모르는 타입이면 None 을 돌려주고 잡이 등록되지 않는다.
    ScheduleManager.get_all_jobs:
      역할: "등록된 잡 목록 조회"
      등급: I

- module: services/custom_schedule_registry.py
  fns:
    is_per_date_dedup:
      역할: "이 커스텀 종류가 '날짜마다 따로 발송' 대상인지 판정"
      등급: D
      핵심: true
      주의: "기본은 투숙 1회지만, 파티 당일 MMS 는 연박자가 매일 파티에 참여하므로 날짜마다 나가야 한다"
    get_custom_types:
      역할: "화면 드롭다운용 커스텀 종류 목록"
      등급: I
    _refresh_surcharge:
      역할: "추가요금 발송 직전 칩 상태를 최신화한다"
      등급: D
      핵심: true
      주의: |
        ★ 대상을 **두 갈래로 합집합**한다.
        (1) 그날 방이 배정된 예약 — 새로 생기거나 유지될 칩
        (2) 그날 추가요금 미발송 칩이 **이미 있는** 예약 — 배정이 풀려서 배정표엔 없는데
            칩만 남은 경우
        (2)가 없으면 **잘못된 과금 문자가 나간다**. 정리 로직은 배정이 없으면 삭제하도록
        이미 되어 있어서, 대상에 넣어주기만 하면 된다.
    _refresh_party3_today_mms:
      역할: "파티 MMS 발송 직전 칩 최신화"
      등급: D
    _refresh_room_upgrade:
      역할: "업그레이드 안내(약속/후기) 발송 직전 칩 최신화 — 공통 핸들러"
      등급: D
      주의: "추가요금과 동일한 두 갈래 합집합 방식. 종류에 따라 약속/후기 일괄 함수로 분기"
    _refresh_room_upgrade_promise:
      역할: "약속 칩 최신화 (공통 핸들러에 종류만 넘김)"
      등급: I
    _refresh_room_upgrade_review:
      역할: "후기 칩 최신화 (공통 핸들러에 종류만 넘김)"
      등급: I
    get_pre_send_refresh_handler:
      역할: "그 커스텀 종류에 등록된 사전 새로고침 함수를 찾아준다"
      등급: I
      핵심: true
      주의: "★ 이 레지스트리 패턴이 이 저장소의 검증된 확장 방식이다 — 새 종류 추가 = 표에 한 줄"

- module: api/template_schedules.py
  fns:
    _validate_schedule_inputs:
      역할: "스케줄 설정 검증 — 등록된 커스텀 종류인지, 알려진 필터 타입인지"
      등급: G
      핵심: true
      주의: "필터는 **정규화한 뒤**(옛 형식 → 새 형식) 검사한다. 원본으로 검사하면 옛 형식이 전부 거부된다"
    _schedule_to_response:
      역할: "스케줄을 화면용 형태로 변환"
      등급: I
      주의: "★ 다음 실행 시각은 **APScheduler 에서 실시간으로 읽는다** — DB 값은 낡을 수 있다. 조회 실패는 무시하고 DB 값으로 폴백"
    get_custom_types:
      역할: "커스텀 종류 목록 API (무인증)"
      등급: I
    get_schedules:
      역할: "스케줄 목록 조회"
      등급: I
    get_schedule:
      역할: "스케줄 단건 조회"
      등급: N
    create_schedule:
      역할: "스케줄 생성. 타입별 필수 항목을 검증하고 APScheduler 에 즉시 등록"
      등급: G
      핵심: true
      주의: |
        · 타입마다 필수 항목이 다르다 — 매일(시·분) / 매주(시·분·요일) / 매시(분) / 간격(간격분)
        · ★ **객실 필터가 없으면 연박제외 옵션을 자동으로 지운다**. 객실 배정과 무관한
          스케줄에 연박 옵션이 붙으면 의미가 없기 때문. 단 **이벤트 카테고리는 예외** —
          신규 예약 대상이라 배정과 무관하게 옵션을 단독으로 쓴다
        · 만료 일수를 주면 만료 시각을 계산해 저장
    update_schedule:
      역할: "스케줄 수정. 변경분을 APScheduler 에 반영"
      등급: G
      주의: "APScheduler 반영 실패는 경고만 출력하고 응답은 성공 — DB 와 스케줄러가 어긋날 수 있고, 그때 비상용 동기화 API 를 쓴다"
    delete_schedule:
      역할: "스케줄 삭제. 잡 제거 + **이 스케줄이 만든 칩만** 삭제"
      등급: G
      핵심: true
      주의: "★ 다른 스케줄이 만든 칩은 보존한다. 기본 보호 규칙(발송완료·수동·제외·실패)도 그대로 적용"
    run_schedule:
      역할: "운영자가 스케줄을 즉시 수동 실행"
      등급: I
    preview_targets:
      역할: "발송하지 않고 대상만 미리보기"
      등급: I
    auto_assign:
      역할: "활성 스케줄들의 칩을 일괄 생성한다 (운영자 버튼)"
      등급: D
      주의: |
        · 템플릿이 없거나 비활성인 스케줄은 건너뜀
        · **이벤트 스케줄은 사전 칩 생성이 불가**하므로 제외 (발송 시점에 대상이 정해짐)
        · 날짜를 지정하면 날짜 설정이 없는 스케줄에 **임시로 넣었다가 원복**한다 (DB 저장 안 함)
    sync_schedules:
      역할: "전체 스케줄을 APScheduler 에 재동기화 (비상용)"
      등급: I
      주의: "평소엔 쓸 일이 없다 — CRUD 마다 자동 반영되고 서버 기동 시 전체 로드된다. DB 직접 수정이나 불일치 의심 시에만"
