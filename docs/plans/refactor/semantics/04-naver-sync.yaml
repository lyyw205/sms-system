# 네이버 동기화 — 예약 데이터가 시스템에 들어오는 유일한 자동 통로.
# 이 파일 하나에 "인입 · 정제 · 저장 · 파생상태 갱신 · 후속 모듈 호출" 이 전부 들어있다.
# 5분마다 돌기 때문에, 여기서 잘못 판단하면 5분마다 반복해서 사고가 난다.

- module: services/naver_sync.py
  fns:
    _parse_gender_from_custom_form:
      역할: "'남 24 여 25 남 21' 같은 자유입력 글에서 남녀 인원을 세어낸다 (언스테이블 예약용)"
      등급: D
      주의: |
        · '남자' 를 '남' 보다 먼저 매칭해 한 사람을 두 번 세지 않게 한다
        · 총원을 알려주면 **파싱 합계가 총원과 정확히 일치할 때만** 결과를 채택한다. 안 맞으면
          None 을 돌려주고 호출자가 다른 방법으로 폴백 — 애매하면 안 쓰는 보수적 설계
    _parse_datetime:
      역할: "네이버가 준 시각 문자열을 파싱한다"
      등급: G
      주의: |
        ⚠️ 반드시 시간대 정보를 떼고(naive) 돌려줘야 한다. DB 컬럼이 naive 라서, 시간대가 붙은
        채로 두면 매 동기화마다 '값이 달라졌다' 고 오판해 확정 예약마다 쓸데없는 UPDATE 가 났다.
        시간대를 UTC로 변환하면 9시간이 밀려서 취소목록·정렬이 깨지므로 **변환이 아니라 제거**여야 한다.
        파싱 실패는 None.

    sync_naver_to_db:
      역할: "네이버 동기화 전체 지휘자. 예약을 가져와 정제하고 저장한 뒤, 연박·자동배정·칩·이벤트문자까지 순서대로 굴린다"
      등급: D
      핵심: true
      순서: |
        Phase 1 가져오기 → 2 정제·저장 → 2.5 다객실 분할 → 2.8 분할그룹 정합경보 →
        4 연박감지 → 4b 침대순서 정렬 → 5 자동배정 → 5후 칩 정합 → 6 이벤트문자 훅.
        ★ 칩 정합이 자동배정 **뒤**에 와야 한다. 배정이 없는 상태에서 칩을 만들면 건물 조건
        칩이 안 생겨서 두 번 돌려야 했다. 순서를 앞으로 되돌리면 연산이 2배가 되고 칩이 샌다.
      주의: |
        · 대상 조회가 두 갈래 — 평소엔 '등록일 기준', 대사 모드(09:55)엔 '체크인일 기준'
        · 월별로 나눠 가져오다 겹칠 수 있어 external_id 로 중복 제거(나중 것 채택)
        · 상품ID→이름/구역/기준인원/도미토리 매핑을 미리 만들어 쓴다
        · 인원 계산이 **상품 종류마다 다르다**: 액티비티·도미토리·언스테이블은 예약수량이 곧 인원,
          일반실은 인원옵션 우선 없으면 기준인원
        · 객실 매핑이 없는 상품(차량투어 등)은 정체불명이라 분할 대상에서 제외
        · 기존 예약 조회 시 분할 형제(naver_split)는 매칭 후보에서 뺀다 — 형제가 대표를 오염시키지 않게
        · 저장 루프 안에서는 DB 쓰기·flush 를 하지 않고 파이썬 리스트에만 후보를 모은다.
          경보 발화는 메인 커밋 **이후** 별도 단계 — 로그 기록이 세션을 오염시켜 동기화 전체가
          롤백되는 걸 막기 위함
        · Phase 4·5·5후·6 은 각각 try/except 로 격리. 하나가 실패해도 나머지는 진행하고,
          5분 뒤 다음 주기에 자연 재시도된다
        · 당일 자동배정 컷오프 15시 — 15시 전이면 오늘도 자동배정, 이후엔 내일부터만(체크인
          임박이라 운영자 수동에 맡김). 대사 모드는 항상 오늘 포함
        · 칩 정합 시 테넌트를 명시 필터한다. 테넌트 컨텍스트가 없으면 예외를 던져 중단
        · 이벤트문자 훅은 fire-and-forget — 실패해도 동기화에 영향 없음

    _align_bed_orders_for_groups:
      역할: "연박 그룹 안에서 같은 도미토리 방에 배정됐는데 침대 번호가 제각각인 걸 통일한다"
      등급: D
      주의: |
        대상 범위를 좁혀놨다 — 체크아웃이 오늘 이후이고 체크인이 5일 이내인 그룹만.
        과거 그룹은 정렬 의미가 없고, 먼 미래는 가까워지면 다음 주기에 자동 처리된다.
        기준은 '그 방에서 먼저 발견된 0 아닌 침대번호'. 도미토리만 대상.

    _init_gender_counts:
      역할: "예약의 남/여 인원을 정한다"
      등급: D
      핵심: true
      주의: |
        우선순위가 3단계다.
        (1) 다객실 분할로 미리 계산된 값이 있으면 그것
        (2) 언스테이블 자유입력 파싱 결과가 있으면 그것
        (3) 예약자 성별 한 글자('남'/'여')로 전 인원을 몰아준다. 성별을 모르면 (None, None)
        (None, None) 은 '모름' 이지 0명이 아니다 — 이후 로직이 이 구분에 의존한다

    _split_multi_room_reservations:
      역할: "네이버가 '객실 3개' 를 한 건으로 보내면, 대표 1건 + 형제 2건으로 쪼갠다. 우리 스키마가 한 예약=한 방=한 날짜라서 안 쪼개면 배정이 불가능"
      등급: D
      핵심: true
      주의: |
        · 형제는 external_id 와 naver_booking_id 를 **둘 다 비운다**. 그래야 다음 동기화에서
          매칭 후보가 되지 않는다. 대신 네이버 쪽 변경·취소는 **대표에만** 자동 반영되고
          형제는 운영자가 손으로 처리해야 한다 (설계상 감수한 한계)
        · 분할 제외 조건 4가지: 수량 1 이하 / 도미토리(수량=인원 의미) / 객실 매핑 없는 상품 /
          이미 저장된 예약(재동기화)
        · 인원·금액·수량을 균등 분할하되 **나머지는 전부 대표에 몰아준다**. 합계가 보존되게
          하려는 것이므로 반올림 방식을 바꾸면 합이 틀어진다
        · 인원은 형제도 최소 1명 보장(max(1, ...))
        · 대표·형제를 잇는 키를 `nsplit-{예약번호}` 로 심는다. 예약번호가 없으면 None (키 없는 분할)

    _create_reservation:
      역할: "네이버 데이터로 새 예약 행을 만든다"
      등급: D
      핵심: true
      주의: |
        · 상태값이 이상하면 '확정' 으로 처리한다 (버리지 않음)
        · 구역은 화이트리스트에 있는 값만 채택하고, 아니면 '미배정'
        · 상품에 기본 파티차수가 걸려 있으면 자동 상속하는데, **액티비티는 상속 차단**.
          자동 상속하면 파티 MMS 가 오발송되고 체크인 명단에 자동 노출되기 때문
        · 체크아웃이 빈 문자열이면 None 으로 정규화

    _update_reservation:
      역할: "이미 있는 예약을 네이버 최신 정보로 갱신한다. 이 시스템에서 보호 규칙이 가장 촘촘한 함수"
      등급: G
      핵심: true
      순서: "상태·취소시각·잠금을 먼저 확정한 뒤에 취소 후처리를 부른다 (예약관리 PATCH 경로와 순서를 맞춘 방어적 정렬)"
      주의: |
        ★ 여기가 '네이버가 직원의 수정을 덮어쓰지 못하게' 막는 최전선이다.

        [분할 동결(freeze)]
        분할로 값이 쪼개진 예약은 네이버 원본으로 덮으면 형제들과 합계가 어긋난다. 그래서
        수량·금액·인원을 갱신하지 않는다. 조건이 OR 두 갈래인데, 두 번째(분할그룹 키 보유)는
        상품 매핑이 해제돼도 동결을 유지하려고 나중에 추가된 것 — 실제 사고를 막은 구멍 봉인이다.
        이 구조가 발동하면 로그를 남긴다.

        [운영자 편집 보호]
        이름·전화·방문자·요청사항은 관문(Mutator)을 통과시켜 직원이 손댄 필드를 지킨다.
        체크인·체크아웃도 관문을 타는데, 잠금이 걸려 있으면 건너뛴다.

        [체크아웃 특수 처리]
        · 빈 문자열은 None 으로 정규화 — 안 하면 빈 값을 실값으로 오인해 계속 재발화
        · 잠금이 걸렸고 네이버가 더 이른 날짜를 보내면 **덮어쓰지 않고** 중요 로그만 남긴다
          (직원이 연장했는데 네이버가 아직 못 따라온 상황)
        · 네이버가 연장분을 따라잡았으면 연장표시를 지운다

        [성별 인원 재계산]
        직원이 손수정한 예약(gender_manual)은 아예 건드리지 않는다.
        도미토리·액티비티는 수량이 곧 인원이라 **매 동기화마다** 재계산, 일반실은 **최초 1회만**.

        [상태 잠금 — 3갈래]
        직원이 삭제(soft cancel)한 예약은 상태 잠금이 박혀 있어 네이버가 되살릴 수 없다.
        잠금이 있을 때 세 경우로 갈린다.
          (a) 이미 취소 상태 → 그대로 둔다 (부활 차단, 정상)
          (b) 확정 상태인데 네이버도 확정 → **잠금이 낡은 것**이라 스스로 제거하고 취소시각도
              지운다. 안 그러면 매 동기화마다 중요 경보가 무한 발생
          (c) 그 외 → 진짜 모순이라 경보만 남기고 자동 보정은 하지 않는다 (데이터 안전 우선)

        [취소 시 연쇄]
        상태가 실제로 바뀌었을 때만 후속 처리가 돈다(멱등).
        취소면 → 연장표시·잠금 해제 → 당일/사전 판정 → 배정·칩 정리 → 연박그룹 해제 →
        남은 멤버 칩 재계산(개별 예외 억제).

        [변경 감지 후처리]
        날짜 바뀜 → 날짜 후처리. 인원·성별 바뀜 → 제약 검증. 성별·객실타입 바뀜 → 칩 재계산
        (확정 상태일 때만). 이 세 감지는 각각 독립적으로 판단된다.

        [건드리지 않는 것]
        updated_at 을 강제로 갱신하지 않는다. 예전엔 매 5분 no-op 동기화마다 전 행 UPDATE 가
        나갔던 원인이라 제거됐다 — 되살리면 DB 부하가 돌아온다.
