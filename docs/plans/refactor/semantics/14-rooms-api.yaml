# 객실 설정 API — 방·건물·그룹·네이버 상품 매핑·등급 관리.
# 설정 변경이 기존 배정과 문자 칩에 연쇄로 영향을 준다.

- module: api/rooms.py
  fns:
    _remap_active_field:
      역할: "화면이 보내는 필드명을 DB 컬럼명으로 바꾼다"
      등급: I
    _room_to_response:
      역할: "객실 정보를 화면용 형태로 변환 (건물명·그룹·상품 매핑 포함)"
      등급: I
    _sync_biz_item_links:
      역할: "객실↔네이버 상품 N:M 매핑을 갱신한다. 기존 우선순위는 보존하고, 새 건 추가, 없어진 건 삭제"
      등급: D
      핵심: true
      주의: |
        · ★ 넘어온 상품 id 가 **현재 테넌트의 것인지 먼저 검증**한다. 하나라도 남의 것이면 400
        · 기존 매핑의 성별 우선순위는 명시적으로 넘어온 것만 갱신하고 나머지는 유지
        · 마지막에 예약행의 옛 단일 상품 필드에 **첫 번째 id 를 넣는다** (하위호환)
    get_rooms:
      역할: "객실 목록 조회"
      등급: I
    _biz_item_to_response:
      역할: "네이버 상품을 화면용 형태로 변환"
      등급: I
    get_naver_biz_items:
      역할: "네이버 상품 목록 조회"
      등급: I
    update_biz_items:
      역할: "상품 설정 일괄 수정 — 표시명·기본인원·구역힌트·기본파티차수·등급"
      등급: D
      핵심: true
      주의: |
        · 빈 문자열은 전부 NULL 로 정규화한다 (표시명·구역힌트·파티차수)
        · 등급은 1~5 정수만 허용, 아니면 400
        · ★ 등급이 바뀐 상품이 있으면 **커밋 전에** 업그레이드 칩을 재계산한다.
          같은 트랜잭션에 묶어야 경합이 없다
        · 없는 상품 id 는 조용히 건너뛴다 (에러 아님)
    update_room_grades:
      역할: "객실 등급 일괄 수정"
      등급: D
      순서: "① 전체 검증 먼저 → ② 존재 확인 → ③ 일괄 수정 → ④ 커밋 전 칩 재계산"
      주의: "★ **검증을 전부 먼저** 한다. 한 행이라도 잘못되면 DB를 아예 안 건드린다. 없는 id 가 있으면 404"
    _reconcile_room_upgrade_after_grade_change:
      역할: "등급이 바뀐 뒤 영향받는 예약들의 업그레이드 칩을 다시 계산한다"
      등급: D
      핵심: true
      주의: |
        · 객실 등급이 바뀌면 → 그 방에 배정된 **오늘 이후** 예약들
        · 상품 등급이 바뀌면 → 그 상품을 예약한 **진행중·미래** 예약의 **투숙 전 박일**
        · 날짜별로 묶어서 일괄 함수에 넘긴다
        · 업그레이드 모듈이 스케줄 비활성 시 즉시 종료하므로, 등급만 입력해두는 운영 단계에서는
          부담이 0이다
        · 실패는 날짜별로 경고만 남기고 계속
    sync_naver_biz_items:
      역할: "네이버에서 상품 목록을 가져와 동기화한다"
      등급: D
      핵심: true
      주의: |
        ★ **운영자 전용 컬럼은 절대 덮어쓰지 않는다** — 표시명·기본인원·구역힌트·기본파티차수·등급.
        네이버 응답에 없는 필드라 덮으면 운영자가 입력한 설정이 날아간다.
        새 운영자 컬럼을 추가할 때도 이 원칙을 지켜야 한다.
        동기화 결과에 없는 기존 상품은 비활성화한다 (삭제 아님).
        분당 5회 제한.
    get_room_groups:
      역할: "객실 그룹 목록 조회"
      등급: I
    create_room_group:
      역할: "객실 그룹 생성"
      등급: I
    update_room_group:
      역할: "객실 그룹 수정"
      등급: I
    delete_room_group:
      역할: "객실 그룹 삭제"
      등급: I
    get_room:
      역할: "객실 단건 조회"
      등급: N
    create_room:
      역할: "객실 생성"
      등급: D
    update_room:
      역할: "객실 수정. 배정에 영향을 주는 필드가 바뀌면 경고를 함께 돌려준다"
      등급: G
      핵심: true
      주의: |
        · **배정 영향 필드 감지** — 상품 매핑·기준인원·도미토리 여부·침대수 중 하나라도 바뀌면
          영향받을 미래 배정을 세어 화면에 경고를 띄운다. **자동으로 고치지는 않는다**
        · 감지는 필드명 변환 **전**에 원본 키로 한다 (변환 후엔 이름이 달라져 놓친다)
        · 상품 매핑 입력이 두 형태(우선순위 포함/미포함)로 올 수 있고, 포함된 쪽이 우선
        · 옛 단일 상품 필드도 아직 받아준다 (하위호환)
    reorder_rooms:
      역할: "드래그로 바꾼 객실 순서를 일괄 저장"
      등급: G
      주의: "★ 현재 테넌트의 **전체 객실 id 와 정확히 일치**해야 한다. 중복도 누락도 거부 — 부분 정렬을 허용하면 안 보낸 객실과 순서가 충돌한다"
    delete_room:
      역할: "객실 삭제"
      등급: D
    hide_room:
      역할: "객실을 화면에서 감춘다. **오늘 이후 배정을 전부 삭제**해 그 손님들을 미배정으로 보낸다"
      등급: G
      핵심: true
      주의: |
        ★ 단순 표시 토글이 아니라 **데이터를 지우는 동작**이다.
        · 오늘 이후 배정만 삭제하고 **과거는 이력으로 보존**한다
        · 영향받은 예약마다 삭제된 날짜만 지정해 칩을 재계산한다
        · 이미 감춰진 방이면 아무것도 안 하고 성공을 돌려준다(멱등)
        · 활동로그에 영향받은 예약 id 를 전부 남긴다
        · 진입 시 중요 진단로그를 남긴다
    unhide_room:
      역할: "객실을 다시 보이게 한다"
      등급: D
      주의: "★ 감출 때 삭제된 미래 배정은 **자동 복구되지 않는다** (정책). 필요하면 운영자가 수동/자동 배정을 다시 돌려야 한다 — 비대칭이 의도된 것"
    trigger_auto_assign:
      역할: "운영자가 버튼으로 자동 배정을 즉시 실행"
      등급: I
