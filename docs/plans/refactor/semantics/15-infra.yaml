# 인프라 — 테넌트 격리(유일한 강제 관문) · 인증 · 요청 의존성 · 진단로그.
# 도메인 로직은 없지만, 이게 깨지면 다른 테넌트 데이터가 새거나 문자가 잘못 나간다.

- module: db/tenant_context.py
  fns:
    _resolve_tenant_context:
      역할: "지금 세션이 어느 테넌트로 열렸는지, 격리를 우회 중인지 읽는다"
      등급: G
      핵심: true
      주의: "세션 객체(session.info)에만 담는다 — 예전엔 ContextVar 를 썼는데 비동기 작업들 사이에서 값이 새는 문제가 있었다. 세션이 곧 컨텍스트다"
    get_session_tenant_id:
      역할: "세션의 테넌트 id 를 꺼내는 공개 헬퍼"
      등급: I
    is_session_bypass:
      역할: "이 세션이 격리 우회 모드인지 확인"
      등급: I
    _set_tenant_on_new_objects:
      역할: "새로 만드는 행에 테넌트 id 를 자동으로 박는다 (INSERT 직전)"
      등급: G
      핵심: true
      주의: "★ 이 시스템에서 **강제되는 관문 2개 중 하나**. 개발자가 깜빡해도 자동으로 들어간다. 이미 값이 있으면 건드리지 않는다"
    register_tenant_model:
      역할: "이 모델은 테넌트별로 격리해야 한다고 등록한다"
      등급: G
      주의: "등록을 빠뜨린 모델은 자동 필터가 안 걸린다 — 새 모델 추가 시 반드시 등록해야 한다"
    _apply_tenant_filter_on_select:
      역할: "모든 조회에 '내 테넌트 것만' 조건을 자동으로 붙인다"
      등급: G
      핵심: true
      주의: |
        ★ **강제 관문의 본체.** 이 시스템에서 우회가 0건인 유일한 규칙이다.
        · **컨텍스트 없이 테넌트 모델을 조회하면 RuntimeError 를 던진다**(fail-closed).
          조용히 전체를 돌려주지 않는다 — 이게 핵심
        · 우회 모드면 그냥 통과
        · 필터를 붙이면 또 이벤트가 걸려 무한 재귀가 되므로, 처리 완료 표시를 달아 막는다
        · 조회 형태가 3가지라 각각 모델을 찾아낸다 — `query(Model)` / `query(Model.컬럼)` /
          `query(func.count()).select_from(Model)`. 마지막은 컬럼 정보로 못 찾아서
          FROM 절을 직접 뒤진다
        ⚠️ SQLAlchemy Core (`exists()` 등) 는 이 이벤트를 안 탄다 — 그래서 코드 곳곳에
        명시 테넌트 필터가 이중으로 들어가 있다.
    _resolve_model_from_expr:
      역할: "컬럼 표현식에서 어느 모델인지 역추적한다"
      등급: I

- module: api/deps.py
  fns:
    get_current_tenant_id:
      역할: "요청 헤더에서 테넌트를 읽고, 이 사용자가 그 테넌트에 접근할 권한이 있는지 검증한다"
      등급: G
      핵심: true
      주의: |
        · 헤더가 없으면 400 — 기본값으로 넘어가지 않는다
        · ★ **필요한 컬럼만 로드**한다(id·활성여부). 예전엔 전체 컬럼을 로드해서 매 요청마다
          1KB 짜리 네이버 쿠키까지 읽었다. 104개 엔드포인트 × 모든 요청이라 부담이 컸다.
          쿠키가 필요한 소수 엔드포인트는 아래 전체 로더를 따로 쓴다
        · 토큰 해석을 **함수 안에서** 한다 — 인증 모듈이 이 파일을 import 하므로 순환을 피하려는 것
        · **인증 없으면 401**(fail-closed). 토큰이 깨졌으면 조용히 넘기고 뒤쪽 인증이 401 을 낸다
        · SUPERADMIN 은 테넌트 매핑 검사를 건너뛴다. 나머지는 매핑이 없으면 403
    get_current_tenant:
      역할: "테넌트 전체 정보가 필요한 엔드포인트용 (네이버 쿠키·알리고 설정 등)"
      등급: I
      주의: "위 함수에 의존해 권한 검증을 재사용한다"
    _remap_active_field:
      역할: "화면의 `active` 를 DB의 `is_active` 로 바꾼다"
      등급: I
    _diff_fields:
      역할: "수정 전후를 비교해 **실제로 값이 바뀐 필드만** 추려낸다"
      등급: I
      주의: "폼 전체를 재제출하면 안 바뀐 필드까지 '변경됨' 으로 찍히던 문제를 고친 것. 날짜/시각은 문자열로 정규화해서 비교한다"
    get_tenant_scoped_db:
      역할: "테넌트 컨텍스트가 박힌 DB 세션을 만들어 요청에 넘긴다. **거의 모든 엔드포인트가 이걸 쓴다**"
      등급: G
      핵심: true
      주의: "예외가 나면 롤백하고 다시 던진다. 끝나면 반드시 닫는다"

- module: auth/utils.py
  fns:
    hash_password:
      역할: "비밀번호를 bcrypt 로 해싱"
      등급: G
    verify_password:
      역할: "비밀번호 검증"
      등급: G
    create_access_token:
      역할: "접속 토큰 발급 (기본 1시간)"
      등급: G
    decode_access_token:
      역할: "접속 토큰 검증·해석"
      등급: G
    create_refresh_token:
      역할: "갱신 토큰 발급 (기본 7일)"
      등급: G
      주의: "토큰 안에 `type: refresh` 를 넣는다"
    decode_refresh_token:
      역할: "갱신 토큰 검증"
      등급: G
      핵심: true
      주의: "★ **`type` 이 refresh 가 아니면 거부**한다. 이게 없으면 접속 토큰으로 무한 갱신이 가능해진다"

- module: auth/dependencies.py
  fns:
    get_current_user:
      역할: "토큰에서 로그인 사용자를 찾아낸다"
      등급: G
      핵심: true
      주의: "만료와 그 외 토큰 오류의 **에러 메시지를 구분**한다 (화면이 재로그인 안내를 다르게 하려고). 비활성 사용자도 401"
    require_role:
      역할: "특정 역할만 통과시키는 의존성을 만드는 공장"
      등급: G
      핵심: true
    verify_tenant_access:
      역할: "이 사용자가 그 테넌트에 접근 가능한지 검증"
      등급: G
      주의: "`get_current_tenant_id` 안에도 같은 검사가 들어있다 — 중복 후보"

- module: diag_logger.py
  fns:
    _gzip_namer:
      역할: "회전된 로그 파일 이름에 .gz 를 붙인다"
      등급: I
    _gzip_rotator:
      역할: "회전 시 로그를 gzip 압축한다"
      등급: I
      주의: "압축이 실패해도 **회전 자체는 성공해야 하므로** 압축 없이 이름만 바꿔 폴백한다"
    get_diag_logger:
      역할: "진단 로거 싱글톤을 만든다"
      등급: I
      핵심: true
      주의: |
        · off 모드면 아무 출력 없는 핸들러를 붙여 완전 무음
        · ★ 로그 디렉토리에 **실제로 써보는 검사**를 한다 (makedirs 성공만으로는 부족)
        · 파일 핸들러 설치가 실패하면 **stderr 로 폴백**하고 해결 방법까지 안내한다.
          컨테이너 권한 문제로 로그가 통째로 사라지는 걸 막는 장치
        · 자정 회전, 7일 보관
    mask_phone:
      역할: "전화번호를 마스킹 (010****5678)"
      등급: G
      핵심: true
      주의: "불변식 INV-8 이 '로그에 마스킹 안 된 번호가 없을 것' 을 강제한다. 8자 미만이면 통째로 ***"
    mask_name:
      역할: "이름을 마스킹 (홍**)"
      등급: G
    diag:
      역할: "진단 이벤트를 기록한다. 이 시스템의 회귀 탐지 안전망(정답지)의 입력"
      등급: I
      핵심: true
      주의: |
        ★ **레벨이 안 맞으면 즉시 반환**한다 — 문자열 포맷 비용도 안 든다.
        off 모드에서 성능 부담이 0인 이유.
        요청 id 와 사용자 동작을 자동으로 붙인다. 테넌트 id 는 **자동 주입하지 않는다** —
        호출자가 명시적으로 넘겨야 한다.
        값이 None 인 필드는 출력에서 뺀다.
        ⚠️ 여기서 찍는 **이벤트 문자열이 정답지의 키**다. 리팩토링 중 이름이 바뀌면
        정답지 전체가 무효가 된다.
    set_request_context:
      역할: "요청 시작 시 요청 id 와 동작명을 컨텍스트에 심는다"
      등급: I
    reset_request_context:
      역할: "요청 끝날 때 컨텍스트를 되돌린다"
      등급: I
    is_enabled:
      역할: "그 레벨이 실제로 기록되는지 확인 (테스트용)"
      등급: I
    current_level_name:
      역할: "현재 진단 레벨 이름"
      등급: I
