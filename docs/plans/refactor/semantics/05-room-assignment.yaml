# 객실 배정 — 예약과 방을 날짜별로 잇는 곳.
# 이 파일에는 두 종류가 섞여 있다:
#   (가) 예약 라이프사이클의 일부 — 날짜 바뀌면 따라와야 하는 정리 작업
#   (나) 배정 알고리즘 자체 — 누구를 어느 방에, 도미토리 성별·용량 규칙

- module: services/room_assignment.py
  fns:
    _resolve_prefixed_password:
      역할: "손님에게 보여줄 도어락 표시번호를 정한다. 같은 방·같은 날 다른 팀이 이미 받은 번호가 있으면 그걸 재사용"
      등급: D
      주의: |
        우선순위 3단계 — 같은 방+같은 날 다른 예약의 값 → 같은 예약+같은 방 다른 날의 값 → 신규 생성.
        1번은 도미토리 공동 투숙이나 수동 복수 배정에서 **모든 팀이 같은 번호를 받게** 하려는 것.
        2번은 연박자에게 재발송할 때 번호가 바뀌지 않게 하는 안전망.
        이 재사용 규칙을 없애면 같은 방 손님들이 서로 다른 번호를 받아 혼란이 생긴다.

    _compact_bed_orders_in_cells:
      역할: "도미토리에서 누가 빠져 침대 번호에 구멍이 생기면 1번부터 다시 촘촘히 매긴다"
      등급: D
      주의: "**상대 순서는 유지**하고 번호만 다시 매긴다(침대번호 오름차순, 같으면 생성순). 도미토리 방만 대상이고 일반실은 무시. 진단로그 실패는 통째로 억제"

    _compute_bed_order:
      역할: "도미토리에 넣을 때 몇 번 침대를 줄지 계산"
      등급: D
      핵심: true
      주의: |
        3단계 우선순위.
        (1) 전날 같은 방에 **같은 예약**이 있으면 그 번호 유지 (2박 이상 단일 예약)
        (2) 전날 같은 방에 **같은 연박그룹 멤버**가 있으면 그 번호 유지 (연박 체인)
        (3) 없으면 빈 번호를 1부터 찾는다
        ★ (3)에서 '전날 그 방에 있고 오늘도 계속 묵는 사람' 의 번호도 **사용 중으로 친다**.
          다음날 배정 행이 아직 안 만들어졌을 수 있기 때문. 이 예측이 빠지면 침대번호가 겹친다.
        일반실이면 항상 0.

    sync_sms_tags:
      역할: "예약 하나의 일반 문자 칩을 재계산 (chip_reconciler 로 넘기는 얇은 껍데기)"
      등급: I

    assign_room:
      역할: "예약을 방에 배정한다. 날짜 범위만큼 배정 행을 만들고, 도미토리 규칙 위반자는 밀어내고, 이력을 남기고, 칩을 다시 계산한다"
      등급: D
      핵심: true
      순서: "충돌검사 → 도미토리 밀어내기 → 기존배정 삭제 → 이력기록 → 새 배정 생성(날짜마다 flush) → 구역='room' → 칩 재계산. 날짜마다 flush 하는 이유는 다음 날 침대번호 계산에서 방금 만든 행이 보여야 하기 때문"
      주의: |
        · **액티비티는 배정 자체를 거부**한다(예외 발생). 필드 보호만으로는 부족한 이유는,
          배정 행이 먼저 생기고 구역 대입이 나중이라 행이 남으면 자동격리 전제가 깨지기 때문
        · 방은 활성이고 숨김이 아니어야 조회된다
        · **일반실 동시성** — 날짜마다 SELECT FOR UPDATE 로 잠근다.
          자동 배정이면 이미 점유 시 **예외를 던지고**, 수동 배정이면 공동 점유를 **허용**한다
          (배정 테이블 유니크가 (예약,날짜)뿐이라 같은 방에 여러 예약이 안전)
        · **도미토리 수동 배정 밀어내기(hardline)** — 미래 날짜만 대상.
          남녀 혼숙이거나 정원 초과면 기존 점유자를 전부 미배정으로 밀어낸다.
          날짜별로 SAVEPOINT 로 격리해서 한 날짜 실패가 다른 날짜를 망치지 않게 한다.
          밀어낸 뒤 남은 사람 침대번호를 촘촘히 하고(새 예약 넣기 **전에**), 활동로그와 중요 진단로그를 남긴다.
          밀려난 예약은 즉시 재배정하지 않는다 — 미래 날짜뿐이라 그 날이 오면 10:01 스케줄러가 처리한다
        · 밀려난 사람의 칩 정리는 예약별 1회(중복 제거) + (예약,날짜)별로 추가요금·업그레이드 칩 삭제
        · 기존 배정 삭제는 **현재 테넌트 것만**
        · 이동/신규를 구분해 활동로그 제목이 달라진다. `skip_logging` 이면 호출자가 일괄 기록
        · 배정 후 구역을 'room' 으로 바꾼다
        반환값이 (배정목록, 밀려난목록) 이고, 호출자는 밀려난 목록으로 사용자 경고를 띄운다.

    unassign_room:
      역할: "예약의 배정을 해제한다. 날짜를 안 주면 전부, 주면 그 범위만"
      등급: D
      핵심: true
      주의: |
        · 활동로그를 먼저 남기고 지운다 (첫 배정의 방 이름 기준)
        · 삭제는 **현재 테넌트 것만**
        · 지운 자리의 침대번호를 촘촘히 한다
        · 추가요금·업그레이드약속·업그레이드후기 칩을 날짜별로 정리한다. 범위를 안 줬으면
          투숙 전 기간이 대상. 이 정리는 통째로 예외 억제 — 실패해도 해제 자체는 성공
        · **구역과 일반 문자 칩은 호출자 책임** (여기서 안 건드림)

    unassign_dates:
      역할: "연속되지 않은 날짜 목록을 골라서 배정 해제 (연박 축소, 당일 취소 등)"
      등급: D
      주의: "위 함수와 달리 활동로그를 남기지 않는다 — 호출자가 자체 기록을 갖고 있다고 전제. 침대번호 정리와 칩 정리는 동일"

    clear_all_for_reservation:
      역할: "예약의 배정을 통째로 지우고 예약행의 객실번호·비번도 비운다"
      등급: D
      주의: "지운 자리 침대번호를 정리한다. 구역과 문자 칩은 호출자 책임"

    sync_denormalized_field:
      역할: "[사용 안 함] 예약행의 객실번호·비번을 배정표에서 채워 넣던 옛 함수"
      등급: L
      주의: "DEPRECATED — 호출처가 없다. 이식 대상에서 제외 검토"

    _shift_daily_records:
      역할: "예약 날짜가 바뀌면 날짜별 정보(파티차수·메모)와 파티 체크인 기록을 같은 간격만큼 평행이동한다"
      등급: D
      핵심: true
      주의: |
        새 위치 = 옛 날짜 + (새 체크인 − 옛 체크인).
        새 투숙 범위 **밖으로 밀려나는 기록은 버린다**(체류 단축 시).
        (예약,날짜) 유니크 제약과 충돌하지 않으려고 **스냅샷 → 전부 삭제 → 재삽입** 순서로 한다.
        이 순서를 바꾸면 제약 위반이 난다.
        체크인이나 체크아웃이 없거나 날짜 파싱이 안 되면 아무것도 안 한다(no-op).
        id·date·created_at·updated_at 은 복사에서 제외한다.

    _reconcile_dates:
      역할: "예약 날짜가 바뀌면 배정표를 새 기간에 맞춘다 — 범위 밖은 지우고, 범위 안 빈 날은 채운다"
      등급: D
      핵심: true
      주의: |
        · 체크인이 없는 손상 데이터면 **아무것도 지우지 않고 그냥 넘어간다**(경고 로그). 이 방어를
          빼면 손상 행의 배정이 통째로 날아간다
        · 범위 밖 삭제 후 침대번호 정리
        · 빈 날짜 채우기는 **기존 배정이 하나라도 있을 때만**. 체크인일에서 가장 가까운 배정을
          기준으로 삼아 **같은 방을 유지**한다 (연박 연장 시 방이 안 바뀌게)
        · 일반실이면 충돌 검사에 FOR UPDATE 를 건다
        · ★ 충돌이 있어도 **밀어내지 않고 공존시킨다**. 연장 때문에 기존 손님을 쫓아내면 안 되기
          때문. 로그만 남긴다 — 배정 시 밀어내기와 정책이 정반대다
        · 삭제나 삽입이 하나라도 있었으면 칩 5종을 재계산한다 (예외 억제)
