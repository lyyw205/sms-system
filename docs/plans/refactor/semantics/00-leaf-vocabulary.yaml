# 어휘 leaf 모듈 — 다른 모든 곳이 "무엇이 무엇인가"를 물어보는 곳.
# app.* import 가 거의 없고, 위층 전체가 의존한다. 코어 1순위 후보.

- module: services/stay_logic.py
  fns:
    is_single_day_stay:
      역할: "'당일 1박이냐 연박이냐'를 판정하는 유일한 기준. 체크아웃이 비었거나(NULL/'') 체크인과 같으면 당일 1박"
      등급: D
      핵심: true
      주의: "체크아웃이 체크인보다 이른 손상 데이터(co<ci)도 '연박'으로 판정한다. 이상하지만 현행 동작이므로 그대로 보존 — 고치면 다른 곳이 깨진다"
    stay_nights:
      역할: "묵는 밤 수 계산. 체크아웃일은 세지 않는 반열림 [체크인, 체크아웃)"
      등급: D
      핵심: true
      주의: "max(1, ...) 바닥값이 있어 co<=ci 도 1박이 된다. 이 값이 추가요금 금액 계산에 그대로 들어가므로 바닥값 제거 금지 — 제거하면 청구액이 바뀐다"

- module: services/party_type.py
  fns:
    effective_party_type:
      역할: "그 날짜에 이 손님이 파티 몇 차에 참여하는지 결정. 날짜별 지정값이 있으면 그것, 없으면 예약 기본값"
      등급: D
      핵심: true
      주의: "Python truthy 폴백이라 빈 문자열('')도 예약값으로 넘어간다. 아래 SQL 판(coalesce)은 ''를 그대로 채택해서 결과가 다르다 — 의도된 차이, 통일 금지"
    effective_party_type_sql:
      역할: "위와 같은 판단의 SQL 버전. 통계·필터 레이어 전용"
      등급: D
      주의: "coalesce 라 NULL 만 폴백하고 ''는 채택. Python 판과 결과가 갈린다"

- module: services/room_grade.py
  fns:
    grade_of_room:
      역할: "배정된 객실의 등급(1~5)을 읽는다"
      등급: D
    grade_of_biz_item:
      역할: "손님이 예약한 상품의 등급(1~5)을 읽는다. 이것과 객실 등급을 비교해 무료 업그레이드 여부를 판정"
      등급: D
      핵심: true
    is_valid_grade:
      역할: "등급 입력값 검증 — 1~5 정수만 허용"
      등급: G
      주의: "bool 을 명시적으로 거부한다 (Python 에서 True 는 int 1 로 통과되기 때문). 재작성 시 이 거부를 빠뜨리기 쉬움"

- module: services/dorm_gender.py
  fns:
    gender_presence:
      역할: "이 예약이 도미토리에 남자를 넣는지 여자를 넣는지 판정. 남/여 인원수가 진실원천이고, 둘 다 비었을 때만 성별 표시문자열을 파싱"
      등급: D
      핵심: true
      주의: "Reservation.gender 는 표시용이라 경로마다 포맷이 다르다('여' vs '여2'). 문자열 등호비교하면 같은 성별도 혼숙으로 오판 — 반드시 인원수 우선"
    dorm_gender_conflict:
      역할: "이 예약을 그 도미토리 칸에 넣으면 남녀 혼숙이 되는지 판정"
      등급: G
      핵심: true
      주의: "빈 칸이거나 한쪽 성별을 모르면 '충돌 아님'. 자기 자신이 혼성인 건 충돌로 안 본다 (다른 예약과의 관계만 판정)"

- module: services/password_display.py
  fns:
    build_prefixed_password:
      역할: "도어락 실제 비밀번호 앞에 랜덤 2자리를 붙인 표시용 번호를 만든다. 도어락이 뒷자리 매칭이라 그대로 열리면서, 손님마다 다른 번호를 줘 유출 위험을 낮춤"
      등급: D
      주의: "끝의 '*'/'#'는 무시하고 숫자 판정. 숫자가 아니면 prefix 를 포기하고 원본을 반환 — 도어락이 안 열리는 사고를 막는 안전장치. 이 분기가 로그에 찍히면 보안 효과가 사라진 상태라는 신호"

- module: services/room_lookup.py
  fns:
    batch_room_lookup:
      역할: "여러 예약의 객실 정보를 한 번에 조회. 예약마다 방을 따로 찾으면 느려서(N+1) 만든 배치 조회"
      등급: I
      핵심: true
      주의: "날짜를 안 주면 '가장 이른 배정'(=첫 밤)을 돌려준다. order_by(date) 로 결정적 선택을 보장하므로 이 정렬 제거 금지. 특정 날짜가 필요하면 호출자가 반드시 날짜를 넘겨야 함"
    batch_room_number_map:
      역할: "위 조회에서 객실번호만 뽑는 간편 래퍼"
      등급: I

- module: services/schedule_utils.py
  fns:
    get_schedule_dates:
      역할: "이 스케줄이 이 예약에 대해 '며칠자 문자'를 만들어야 하는지 날짜 목록을 계산. 문자 칩이 언제 생기는지를 결정하는 핵심"
      등급: D
      핵심: true
      주의: |
        4가지 모드가 완전히 다르게 동작한다.
        (1) event   → 체크인일 1개
        (2) 마지막밤 → 당일1박이면 체크인일. 연박그룹이면 마지막 멤버만 계산하고 나머지는 빈 목록
        (3) 첫밤     → 연박그룹이면 순번 0번만, 나머지는 빈 목록
        (4) 기본     → 투숙 전 기간 매일
        연박그룹에서 '나머지는 빈 목록'을 반환하는 게 중복발송 방지의 핵심인데, 재작성 시 놓치기 쉽다
    date_range:
      역할: "체크인~체크아웃 사이의 '밤' 날짜를 만든다. 체크아웃일은 제외(반열림)"
      등급: D
      핵심: true
      주의: "체크아웃이 없거나 체크인보다 이르면 [체크인] 하나만 반환. 이 폴백이 당일1박 처리의 뿌리"
    resolve_target_date:
      역할: "'어제/오늘/내일' 같은 상대 표현을 실제 날짜로 변환"
      등급: D
      주의: "모르는 값이 오면 오늘로 처리하고 중요 로그를 남긴다. 옛 값(*_checkout 등)이 DB에 남아있어 이 경로를 탄다 — 조용히 오늘로 처리되므로 로그가 유일한 단서"

- module: services/section_registry.py
  fns:
    spec_for:
      역할: "구역(객실/미배정/파티만/언스테이블/액티비티)의 성질표를 꺼낸다. 값이 비었거나 모르는 값이면 '미배정' 성질을 따름"
      등급: D
      핵심: true
    assignable_sections:
      역할: "객실 배정 대상이 되는 구역 목록"
      등급: D
    non_assignable_sections:
      역할: "객실 배정에서 제외할 구역 목록 (자동배정 쿼리의 제외 목록)"
      등급: D
    lodging_sections:
      역할: "숙박 인원으로 세는 구역 목록"
      등급: D
    non_lodging_sections:
      역할: "숙박 통계·문자 브로드캐스트에서 뺄 구역 (현재는 액티비티만)"
      등급: D
    naver_inbound_sections:
      역할: "네이버가 보내줄 수 있는 구역 값 화이트리스트"
      등급: G
    is_assignable:
      역할: "이 구역이 객실 배정 대상인가"
      등급: D
    is_lodging_guest:
      역할: "이 구역이 숙박 인원으로 세는 대상인가"
      등급: D
    has_stay:
      역할: "이 구역에 체크아웃·연박 개념이 있는가 (액티비티는 없음)"
      등급: D
    is_draggable:
      역할: "화면에서 드래그로 옮길 수 있는 구역인가 (프론트 미러 대상)"
      등급: D
    inherits_default_party:
      역할: "네이버 상품의 기본 파티차수를 물려받는 구역인가"
      등급: D
    label_for:
      역할: "구역의 한글 라벨"
      등급: I

- module: services/activity_logger.py
  fns:
    _get_tenant_slug:
      역할: "현재 세션의 테넌트 약칭을 조회 (로그 제목 앞에 [STABLE] 같은 표시를 붙이기 위함)"
      등급: I
    log_activity:
      역할: "운영자가 나중에 볼 활동 기록을 남긴다. 배정·발송·동기화 등 모든 굵직한 동작이 여기를 지난다"
      등급: I
      핵심: true
      주의: "제목에 [테넌트] 접두사가 없으면 자동으로 붙인다. 이미 있으면 중복해서 안 붙임. detail 은 JSON 문자열로 직렬화해 저장 (ensure_ascii=False 라 한글 원문 유지)"

- module: services/event_bus.py
  fns:
    subscribe:
      역할: "화면 실시간 갱신(SSE) 클라이언트 한 명을 등록하고 전용 큐를 준다"
      등급: I
    unsubscribe:
      역할: "클라이언트가 끊기면 큐를 정리. 마지막 한 명이 나가면 테넌트 항목 자체를 제거"
      등급: I
    publish:
      역할: "특정 테넌트의 접속자들에게만 실시간 이벤트를 보낸다"
      등급: I
      주의: "큐가 꽉 찬 클라이언트는 이벤트를 조용히 버린다(경고 로그만). 즉 SSE 는 전달 보장이 없다 — 여기 의존하는 기능을 만들면 안 됨. 진단로그 실패도 통째로 억제"
