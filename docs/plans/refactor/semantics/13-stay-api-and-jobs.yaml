# 연박 연장/축소 API + 스케줄러 잡 배선.
# 연장/축소는 예약 날짜를 바꾸는 몇 안 되는 경로라 잠금·칩·배정이 한꺼번에 움직인다.
# 잡은 "모든 테넌트를 돌며" 실행되므로 테넌트 컨텍스트 전환이 핵심.

- module: api/reservations_stay.py
  fns:
    detect_consecutive_stays:
      역할: "운영자가 버튼으로 연박 감지를 즉시 실행"
      등급: I
    link_stay_group:
      역할: "운영자가 고른 예약들을 손으로 연박 그룹으로 묶는다"
      등급: D
      주의: "검증 실패는 중요 로그 + 400. 묶은 뒤 **자동 확장된 전체 멤버**의 칩 5종을 재계산한다 — 연박 여부가 바뀌면 추가요금 합산 등이 달라지기 때문"
    unlink_stay_group:
      역할: "예약을 연박 그룹에서 뗀다 (운영자 직접 행동)"
      등급: D
      핵심: true
      주의: |
        · ★ `exclude_from_auto_link=True` 로 부른다 — 운영자가 직접 뗐으니 자동 재묶기가
          다시 붙이면 안 된다
        · 떼기 **전에** 영향받을 멤버 id 를 미리 모아둔다 (뗀 뒤엔 그룹 조회가 안 되므로)
        · 그룹에 안 속한 예약이면 404
    extend_stay:
      역할: "연박 1일 추가. 체크아웃을 하루 미루고, 새로 생긴 밤에 방을 배정한다"
      등급: D
      핵심: true
      순서: "예약 로드 → 액티비티 거부 → 충돌 확인 → 체크아웃 연장 + 잠금 → 방 배정 → 배정 후처리 → 날짜 변경 후처리 → 커밋"
      주의: |
        · **액티비티는 거부**한다 (숙박 개념이 없음)
        · 체크아웃이 없는 예약도 거부 — 기준점이 없어 계산이 안 된다
        · ★ **새로 묵는 밤 = 기존 체크아웃일**이다. 체크아웃 5/10 이면 5/10 밤을 자고
          새 체크아웃이 5/11 이 된다. 반열림 규약의 따름정리
        · 관문을 통과시킨 뒤 **연장 표시와 잠금을 명시적으로 한 번 더** 건다.
          관문이 자동으로 걸어주지만 안전망으로 남겨둔 것
        · 충돌하는 손님이 있으면 방 배정을 **건너뛰고** 목록만 돌려준다 —
          운영자가 확인 후 별도 API 로 확정한다
        · 소요 시간을 재서 중요 로그에 남긴다
    extend_stay_assign_room:
      역할: "연장 충돌을 운영자가 확인한 뒤 방 배정을 확정한다"
      등급: D
      주의: "수동 배정이라 **기존 손님을 밀어내지 않고 공존**시킨다. 배정 테이블 유니크가 (예약,날짜) 뿐이라 안전"
    _do_reduce_extension:
      역할: "연박을 N일 줄인다. 사라지는 날짜의 배정·칩·날짜별정보·파티체크인을 전부 정리"
      등급: G
      핵심: true
      순서: "① 배정 해제 → ② 미발송 칩 삭제(발송분 보존) → ③ 날짜별 정보 삭제 → ④ 파티 체크인 삭제 → ⑤ 체크아웃 갱신 + 잠금 처리 → ⑥ 날짜 변경 후처리"
      주의: |
        · 연장 표시가 없으면 거부 (손으로 연장한 예약만 줄일 수 있다)
        · **최소 1박은 남겨야 한다** — 체크아웃이 체크인 이하가 되면 400
        · ★ 발송된 칩은 **삭제 전에 미리 조회해 진단로그로 남긴다**. 그 뒤 강제 삭제를
          걸되 발송분은 보존한다 — 감사 추적용
        · 파티 체크인 삭제는 try/except 로 감싼다 (환경에 따라 테이블이 없을 수 있음)
        · ★ **1박 이하로 되돌아가면 연장 표시와 잠금을 완전히 해제**한다. 안 하면 네이버
          동기화가 이 예약을 영원히 못 고친다. 중요 로그를 남긴다
        · 1박보다 길면 연장 표시를 새 값으로 갱신하고 잠금은 유지
    reduce_extension:
      역할: "연박 축소 API (N일 지정)"
      등급: I
    cancel_extend_stay:
      역할: "연박 취소 API — 축소 1일에 위임하는 옛 호환 경로"
      등급: L

- module: scheduler/jobs.py
  fns:
    _for_each_tenant:
      역할: "모든 활성 테넌트를 돌며 작업을 실행한다. 테넌트마다 세션을 새로 열고 닫는다"
      등급: G
      핵심: true
      주의: |
        ★ 테넌트 목록 조회는 **필터 우회 세션**으로(모든 테넌트를 봐야 하므로),
        각 작업은 **테넌트 전용 세션**으로 실행한다. 이 두 세션을 섞으면 격리가 깨진다.
        테넌트별로 커밋하고, 실패하면 롤백 후 다음 테넌트로 넘어간다 — 한 테넌트 사고가
        다른 테넌트를 막지 않는다. 실패는 Sentry 에 테넌트 태그와 함께 보고된다.
    sync_naver_reservations_job:
      역할: "5분마다 도는 네이버 예약 동기화 (전 테넌트)"
      등급: D
      핵심: true
      주의: "비동기라 `_for_each_tenant` 를 못 쓰고 같은 패턴을 직접 구현한다. 종료 신호(CancelledError)는 다시 던져서 정상 종료되게 한다"
    load_template_schedules:
      역할: "서버 기동 시 DB의 활성 스케줄을 전부 APScheduler 에 등록"
      등급: I
      주의: "모든 테넌트 스케줄을 한 번에 올리므로 필터 우회 세션을 쓴다"
    sync_status_log_job:
      역할: "6시간마다 '동기화 정상 작동 중' 활동로그를 남긴다 (운영자 안심용)"
      등급: I
    detect_consecutive_stays_job:
      역할: "하루 4번(9·10·11·12시) 도는 연박 감지 안전망"
      등급: D
      주의: "주 감지는 동기화 직후에 이미 돈다. 이건 그물망. 테넌트별 실패는 중요 로그만 남기고 집계에서 뺀다"
    reconcile_today_reservations_job:
      역할: "매일 09:55 대사 — 체크인일 기준으로 오늘·내일 예약을 다시 훑어 5분 동기화가 놓친 걸 잡는다"
      등급: D
      핵심: true
      주의: |
        평소 동기화는 **등록일 기준**이라 '오래전에 등록됐는데 오늘 체크인' 인 예약을 놓친다.
        이 잡이 **체크인일 기준**으로 다시 훑는 보완 경로다.
        10:00 자동배정 **직전**에 도는 게 중요 — 배정 전에 누락분이 채워져야 한다.
        언스테이블도 같은 방식으로 대사한다.
    sync_unstable_reservations_job:
      역할: "언스테이블 예약 동기화 (피크 15~20시 10분 간격, 오프피크 00:05·12:05)"
      등급: D
      주의: "언스테이블 설정(사업장 id + 쿠키)이 있는 테넌트만 대상"
    daily_room_assign_job:
      역할: "매일 10:01 객실 자동 배정 (오늘·내일)"
      등급: D
    refresh_snapshots_job:
      역할: "참여 인원 스냅샷을 갱신 (오늘·내일)"
      등급: D
      주의: "하루 4번(00:50·08:50·09:50·11:50) 등록돼 있다. 시각마다 목적이 다른지 코드에 근거가 없다 — 조사 항목"
    split_orphan_sweep_job:
      역할: "매일 09:43 분할그룹 정합 점검 — 취소된 대표 + 살아있는 형제 탐지"
      등급: D
      핵심: true
      주의: |
        ★ **09:43 인 이유가 코드에 명시**돼 있다.
        ① 09:50 스냅샷 → 09:55 대사 → 10:01 자동배정 **보다 먼저** 경보가 떠야 운영자가
           배정 전에 인지할 수 있다
        ② 5분 단위 격자(…09:45…)를 피해서, 5분 동기화와 진짜로 동시에 돌 때 생기는
           중복억제 경합을 없앴다
        이 시각을 옮기면 두 이유가 다 깨진다.
    setup_scheduler:
      역할: "모든 고정 잡을 APScheduler 에 등록한다 (12개 + 기동 시 1회)"
      등급: I
      핵심: true
      주의: "여기가 사실상 '모든 모듈을 아는 배선 파일' 이다. 전부 Asia/Seoul 기준"
    start_scheduler:
      역할: "스케줄러 기동"
      등급: I
    stop_scheduler:
      역할: "스케줄러 정지"
      등급: I
    get_job_info:
      역할: "등록된 잡 목록과 다음 실행 시각을 반환 (관리 화면용)"
      등급: I
