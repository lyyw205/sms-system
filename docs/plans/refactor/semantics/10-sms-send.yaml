# 문자 발송 파이프라인 — 변수 계산 → 템플릿 렌더링 → 발송 → 기록.
# 발송 직전 차단 가드가 4겹 있다. 잘못된 문자가 손님에게 나가면 되돌릴 수 없기 때문.

- module: services/sms_sender.py
  fns:
    find_unreplaced_vars:
      역할: "문자 본문에 치환 안 된 {{변수}} 가 남아있는지 찾아낸다"
      등급: G
      핵심: true

    send_single_sms:
      역할: "문자 한 건을 보내는 공통 함수. 방 정보 조회 → 변수 계산 → 렌더링 → 4겹 검사 → 발송 → 기록"
      등급: G
      핵심: true
      순서: "전화번호 검사 → 변수 계산 → 템플릿 존재 검사 → 방 변수 검사 → 렌더링 → 미치환 검사 → 발송"
      주의: |
        ★ **발송 차단 가드가 4겹**이다. 잘못된 문자는 되돌릴 수 없으므로 전부 필요하다.
          (1) 전화번호 없음 → 차단
          (2) 전화번호 형식 이상 (숫자 9~15자리가 아님) → 차단 + 중요 로그 + 실패 기록
          (3) 템플릿이 없음 → 차단. 이게 없으면 렌더러가 "[Template not found]" 문자열을
              그대로 손님에게 발송해버린다 (실제 사고 방지책)
          (4) 템플릿이 방 변수를 쓰는데 값이 비어 있음 → 차단. 빈칸 문자 발송 방지
          (5) 렌더링 후에도 치환 안 된 변수가 남음 → 차단
        · 앞의 4개는 실패를 칩에 기록하지만, (5) 미치환은 **기록하지 않는다** (불일치)
        · 날짜를 안 주면 예약의 체크인일을 쓴다
        · 템플릿 객체를 한 번만 조회해서 재사용한다 (예전엔 문자 1건당 2번 조회했음)
        · MMS 템플릿 목록에 있으면 전용 발송 경로로 라우팅한다. 발신기가 MMS 를 지원 안 하면
          즉시 실패 처리
        · LMS 제목이 설정돼 있으면 넘기고, 없으면 발신기가 본문 첫 줄을 자동으로 쓴다
        · `skip_activity_log` / `skip_commit` 은 일괄 발송에서 호출자가 직접 관리하려고 쓴다

    SmsSender.__init__:
      역할: "태그 기반 일괄 발송기 초기화"
      등급: I
    SmsSender.send_by_assignment:
      역할: "특정 템플릿·날짜의 미발송 칩을 가진 사람들에게 일괄 발송 (운영자 수동 버튼)"
      등급: D
      주의: |
        · 활성 템플릿이 없으면 예외
        · 대상은 미발송 칩 + 그날 투숙 중 + 확정 상태
        · 활동로그를 **먼저** 만들고 커밋한 뒤, 발송하면서 성공/실패 수를 채운다.
          `finally` 로 감싸서 중간에 터져도 집계가 반영된다
        · 예약을 미리 일괄 조회해 N+1 을 피한다
        · 성공하면 즉시 커밋 (중복 발송 방지)

- module: templates/renderer.py
  fns:
    TemplateRenderer.__init__:
      역할: "렌더러 초기화"
      등급: I
    TemplateRenderer.render:
      역할: "템플릿 키로 조회해서 렌더링"
      등급: D
      주의: "⚠️ 템플릿이 없으면 `[Template '키' not found]` 라는 **문자열을 반환한다**(예외 아님). 이게 그대로 발송되면 사고이므로 호출자(send_single_sms)가 미리 존재를 확인한다"
    TemplateRenderer.render_content:
      역할: "이미 조회한 템플릿 객체로 렌더링 (DB 재조회 없음)"
      등급: D
      핵심: true
      주의: "치환은 단순 문자열 replace 다. 치환 후 남은 {{변수}} 가 있으면 중요 진단로그를 남긴다(앞 5개만). 진단로그 순서가 render() 와 완전히 동일하게 맞춰져 있다 — 정답지 호환용"
    TemplateRenderer.get_template:
      역할: "활성 템플릿을 키로 조회"
      등급: I

- module: templates/variables.py
  fns:
    _apply_buffers:
      역할: "실제 인원에 버퍼를 더하고 반올림한다. 파티 안내 문자에서 실제보다 부풀려 보이게 하는 마케팅 장치"
      등급: D
      핵심: true
      주의: |
        우선순위 3단계 — 성비별 버퍼 > 남/여 개별 버퍼 > 전체 버퍼.
        **성비 동점(남==여)이면 '여성 우세' 설정을 적용**한다.
        성비 버퍼 JSON 파싱이 실패하면 조용히 폴백한다(pass).
        반올림 단위는 **합계에만** 적용하고, 방식은 올림(기본)/반올림/내림 3가지.
    get_or_create_snapshot:
      역할: "그 날짜의 참여 인원 스냅샷을 가져온다. 없으면 그 시점 집계로 만든다 — 하루 동안 문자마다 숫자가 달라지지 않게 고정하는 장치"
      등급: D
      핵심: true
      주의: |
        · 액티비티 인원을 제외한다
        · 확정 + 완료 상태를 센다 (취소 제외)
        · 동시 생성 충돌에 대비해 SAVEPOINT 로 감싼다. 실패하면 재조회하고,
          그래도 없으면 **0짜리 빈 스냅샷을 반환해 발송이 중단되지 않게** 한다
    refresh_snapshot:
      역할: "스케줄러가 하루 4번 불러서 스냅샷을 최신 집계로 갱신한다"
      등급: D
      주의: "있으면 갱신, 없으면 생성. 변화가 있든 없든 로그를 남긴다"
    _calculate_stay_nights:
      역할: "박수 계산 (공용 헬퍼를 감싼 얇은 껍데기)"
      등급: D
    _format_man_won:
      역할: "원 단위를 '만원' 표기로 바꾼다 (20000 → '2', 25000 → '2.5')"
      등급: D
    _inject_surcharge_vars:
      역할: "추가요금 안내 문자용 변수를 계산해 넣는다 — 초과인원·박수·1박당·총액"
      등급: D
      핵심: true
      주의: |
        ★ **이 시스템에서 유일하게 돈을 계산하는 곳**이다.
        · 단가는 테넌트 설정에서 가져오고, 설정이 없으면 기본값(2만원/5천원)
        · 더블룸은 인원 추가비 + **객실 변경비**(인원과 무관, 박당 1회)
        · 총액 = 1박당 금액 × 박수
        · ★ 도미토리 상품 예약은 **초과를 0으로 강제**한다. 앞단 게이트를 우회하는 경합 상황에서
          부당 청구를 막는 2차 방어
        · 추가요금 모듈의 내부 함수 4개를 지연 import 로 빌려 쓴다 (모듈 경계 위반 지점)
    calculate_template_variables:
      역할: "문자에 들어갈 모든 변수를 계산한다 — 이름·전화·방번호·비번·건물·인원통계·날짜별통계"
      등급: D
      핵심: true
      주의: |
        · 방 정보는 **배정표 기준**이고 예약행의 낡은 값은 폴백으로도 안 쓴다
        · 표시용 비번이 없으면 실제 비번으로 폴백
        · **방번호 첫 글자가 A/B 면 건물명을 'A동'/'B동' 으로 덮어쓴다** — 본관 안에서
          A동·B동을 구분하려는 운영 규칙. 건물 테이블 값보다 우선한다
        · 방번호에서 숫자 부분만 정규식으로 뽑는다 ("본관 101호" → "101호")
        · 인원 통계는 스냅샷 기준 (하루 동안 고정)
        · 어제/내일 통계도 각각 스냅샷을 만들어 제공한다 — 즉 **문자 한 건 계산에 스냅샷이
          최대 3개 생성**될 수 있다
        · 추가요금 변수는 특정 템플릿 키 2개에서만 주입한다
        · 사용자 지정 변수가 마지막에 덮어쓴다. 단 `_` 로 시작하는 내부 키는 제외
    get_variable_categories:
      역할: "사용 가능한 변수 목록을 화면용으로 분류해서 반환"
      등급: I
