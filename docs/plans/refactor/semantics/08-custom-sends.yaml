# 커스텀 발송 5종 — 일반 문자와 다른 로직으로 대상을 정하는 특수 안내들.
#   추가요금(일반실/더블) · 파티 당일 MMS · 무료 업그레이드 약속(첫박) · 후기 요청(마지막박)

- module: services/surcharge.py
  fns:
    _is_double_room:
      역할: "이 방이 '더블룸' 인지 판정 (추가요금 단가가 다름)"
      등급: D
      주의: "특정 네이버 상품ID 목록으로 판정한다 — 코드에 하드코딩된 집합. 상품이 바뀌면 코드 수정이 필요한 구조"
    _is_dormitory_reservation:
      역할: "이 예약이 도미토리 상품인지 판정. 도미토리 손님은 침대 단가로 결제했으므로 일반실에 넣어줘도 추가요금을 안 받는다"
      등급: D
      핵심: true
      주의: "상품에 연결된 방이 **전부** 도미토리여야 True. 상품을 모르거나 매핑이 없으면 False(보수적으로 일반실 규칙 적용)"
    _find_schedule:
      역할: "그 커스텀 종류의 활성 스케줄을 찾는다"
      등급: I
    compute_guest_count:
      역할: "예약 인원 계산 — 인원 → 남+여 → 1 순"
      등급: D
      핵심: true
      주의: "순수 계산(DB 안 씀). 추가요금·업그레이드·자동배정 정렬이 전부 이 정의를 공유한다"
    resolve_product_base_capacity:
      역할: "'몇 명까지가 기본인가' 를 정한다. **예약한 상품 기준**이지 배정된 방 기준이 아니다"
      등급: D
      핵심: true
      주의: |
        업그레이드 케이스 때문에 이 구분이 중요하다. 더블룸(기본2)을 예약한 손님을
        스위트(기본4)에 넣어주고 3명이 왔으면 → **1명 초과**로 청구해야 맞다.
        예전 코드는 방 기준(4)으로 봐서 초과 0으로 처리하던 버그가 있었다.
        상품 정보가 없거나 기본인원이 미설정이면 방 기준으로 폴백한다.
    compute_excess:
      역할: "기본 인원을 몇 명 넘겼는지 계산"
      등급: D
      주의: "방이 없으면 0. 음수는 0으로 막는다"
    reconcile_surcharge:
      역할: "예약-날짜 하나의 추가요금 칩을 맞춘다. 일반실용/더블용 두 종류 중 맞는 걸 만들고 반대쪽은 지운다"
      등급: D
      핵심: true
      주의: |
        면제 조건이 3가지 — 그날 배정이 없음 / 도미토리 방 / **도미토리 상품 예약**.
        어느 하나라도 해당하면 칩을 전부 지운다.
        초과가 0 이하면 양쪽 다 지운다.
        ★ **돈 관련이라 예외를 조용히 삼키지 않는다** — 실패 시 중요 진단로그를 남긴다.
        호출자들이 각각 격리돼 있어 전체가 막히진 않는다.
    _ensure_chip:
      역할: "그 종류의 추가요금 칩을 만든다"
      등급: D
      주의: "스케줄이나 템플릿이 비활성이면 만들지 않는다"
    _remove_chip:
      역할: "그 종류의 추가요금 칩을 지운다"
      등급: D
    _delete_all_surcharge_chips:
      역할: "예약-날짜의 추가요금 칩을 종류 불문 전부 지운다 (배정 해제 시)"
      등급: D
      주의: "두 종류를 한 번에 처리한다. 다른 커스텀 발송의 같은 이름 함수와 달리 공통 헬퍼를 안 쓰고 직접 구현돼 있다 — 통합 후보"
    reconcile_surcharge_batch:
      역할: "여러 예약의 추가요금 칩을 한꺼번에 맞춘다"
      등급: I
      주의: "개별 실패가 전체를 막지 않는다"

- module: services/party3_mms.py
  fns:
    _find_schedule:
      역할: "파티 당일 MMS 스케줄을 찾는다"
      등급: I
    reconcile_party3_mms:
      역할: "그 날짜에 2차 파티에 참여하는 손님들의 MMS 칩을 맞춘다 (날짜 기준 전체 스캔)"
      등급: D
      핵심: true
      주의: |
        · 대상은 **2차 참여만**(`2`, `2차만`). '1차만' 은 제외 — 이 집합을 넓히면 오발송
        · 그 날짜의 지정값이 예약 기본값보다 우선
        · 예약이 하나도 없어도 **중단하지 않는다** — 고아 칩을 정리해야 하기 때문
        · 기존 칩 조회를 **템플릿 키 기준**으로 한다. 스케줄 id 기준으로 하면 수동 발송 칩이나
          같은 템플릿의 다른 스케줄 칩을 못 봐서 INSERT 충돌이 나고 바깥 트랜잭션이 오염된다
        · 삭제는 **자기 스케줄이 만든 칩만** — 수동 발송 칩은 보존
    reconcile_party3_mms_for_reservation:
      역할: "예약 하나에 대해서만 파티 MMS 칩을 맞춘다 (예약 변경 직후 호출)"
      등급: D
      주의: "투숙 여부를 여기서 직접 계산한다(퇴실일 제외). 위 함수와 같은 판정이지만 SQL 이 아니라 파이썬 — 두 곳이 어긋나면 칩이 샌다"

- module: services/room_upgrade_common.py
  fns:
    last_night_of_stay:
      역할: "마지막 밤이 며칠인지 계산 — 체크아웃 전날. 체크아웃이 없으면 체크인일 자체"
      등급: D
      핵심: true
      주의: "⚠️ 체크아웃 == 체크인인 경우(당일 표기)의 가드가 **없다**. 그러면 체크인 전날을 반환해 칩이 투숙하지 않는 날짜를 타겟해 미발송된다 (알려진 잠재버그 LB-02, 현행 보존)"
    matches_target_mode:
      역할: "이 날짜가 스케줄이 노리는 밤(첫박/마지막박)과 맞는지 확인"
      등급: G
      주의: "모드가 지정 안 됐으면 항상 통과시킨다 — 스케줄의 의도가 명시되지 않은 것으로 보는 것"
    has_chip_in_stay:
      역할: "이 투숙에 이미 같은 스케줄 칩이 있는지 확인 (발송 여부 무관)"
      등급: G
      핵심: true
      주의: "**투숙 단위 1칩 가드**의 핵심. 스케줄별로 독립이라 약속 1개 + 후기 1개는 공존한다"
    decide_upgrade_eligible:
      역할: "무료 업그레이드 안내를 보낼 자격이 되는지 판정 — 인원 미초과 AND 배정 등급 > 상품 등급"
      등급: D
      핵심: true
      주의: |
        · 도미토리 상품 예약은 인원 초과 개념이 없어 **초과 가드를 면제**한다. 추가요금 로직과
          대칭 — "무료 업글 안내 = 추가금 없음 AND 등급 상승"
        · 기본 인원을 못 구하면(0) 중요 로그 남기고 거부
        · 등급이 한쪽이라도 없으면 중요 로그 남기고 거부 — 운영자가 등급을 안 넣었다는 신호
        · 추가요금 모듈의 계산 함수 3개를 지연 import 로 빌려 쓴다
    ensure_chip:
      역할: "업그레이드 안내 칩을 만든다 (약속/후기 공용)"
      등급: D
      주의: "신규 생성인지 판단하려고 만들기 전에 따로 조회한다. 진단로그 이름에 모듈별 접두사를 붙여 정답지 호환을 유지"
    remove_chip:
      역할: "업그레이드 안내 칩을 지운다 (약속/후기 공용)"
      등급: D
    delete_all_chips:
      역할: "그 종류의 (예약,날짜) 칩을 전부 지운다 — 약속/후기가 공유하는 제네릭"
      등급: D
      핵심: true
      주의: "추가요금 모듈만 이 제네릭을 안 쓰고 같은 로직을 직접 구현하고 있다. 종류를 여러 개 받도록 넓히면 셋을 하나로 합칠 수 있다"
    find_single_schedule:
      역할: "그 커스텀 종류의 활성 스케줄 1개를 찾는다 — 진입 가드용"
      등급: G
      핵심: true
      주의: "운영자가 실수로 2개 만들 수 있어 첫 번째만 쓴다. 없으면 즉시 종료해서 중요 로그 폭주를 막는 안전망"

- module: services/room_upgrade_promise.py
  fns:
    decide_chip:
      역할: "첫박이면서 업그레이드 자격이 되면 True (약속 안내)"
      등급: D
    reconcile_room_upgrade_promise:
      역할: "예약 하나의 '업그레이드 해드릴게요' 안내 칩을 맞춘다"
      등급: D
      순서: "① 스케줄 없으면 즉시 종료 → ② 노리는 밤이 아니면 skip → ③ 자격 판정 → ④ 투숙 1칩 가드 → ⑤ 생성. ①이 없으면 스케줄 비활성 시 중요 로그가 폭주한다"
      주의: "예외는 잡아서 중요 로그만 남긴다"
    reconcile_room_upgrade_promise_batch:
      역할: "여러 예약을 한꺼번에 처리 (개별 실패 격리)"
      등급: I
    _delete_all_room_upgrade_promise_chips:
      역할: "약속 칩을 (예약,날짜)로 전부 삭제 (배정 해제 시)"
      등급: D

- module: services/room_upgrade_review.py
  fns:
    decide_chip:
      역할: "마지막박이면서 업그레이드 자격이 되면 True (후기 요청)"
      등급: D
      주의: "약속(첫박)과 도메인 룰은 같고 **시점만 다르다**. 그래서 둘이 별도 모듈인데 판정 함수 이름이 같다"
    reconcile_room_upgrade_review:
      역할: "예약 하나의 '어떠셨나요' 후기 요청 칩을 맞춘다"
      등급: D
      순서: "약속과 동일 — 스케줄 가드 → 밤 판정 → 자격 → 1칩 가드 → 생성"
    reconcile_room_upgrade_review_batch:
      역할: "여러 예약 일괄 처리"
      등급: I
    _delete_all_room_upgrade_review_chips:
      역할: "후기 칩을 (예약,날짜)로 전부 삭제"
      등급: D
