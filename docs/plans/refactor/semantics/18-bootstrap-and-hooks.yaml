# 앱 부트스트랩(main) · DB 세션 팩토리 · 설정 · 이벤트문자 훅 · Provider 프로토콜.

- module: main.py
  fns:
    SecurityHeadersMiddleware.dispatch:
      역할: "모든 응답에 보안 헤더 3종을 붙인다 (nginx 와 이중 방어)"
      등급: G
      주의: "MIME 스니핑 금지 · iframe 삽입 금지 · 리퍼러 축약"
    diag_correlation_middleware:
      역할: "요청마다 추적 id 를 발급하고 진입·종료·오류를 진단로그에 남긴다"
      등급: I
      핵심: true
      주의: |
        · ★ 진단이 꺼져 있으면 **즉시 통과**한다 (비용 0)
        · ★ `/health` 는 건너뛴다 — 도커 헬스체크가 로그를 도배하기 때문 (불변식 INV-6)
        · 프론트가 보낸 사용자 동작 태그를 URL 디코딩한다 (한글이 들어올 수 있음)
        · 오류는 중요 레벨로 남기고 **다시 던진다**
        · `finally` 로 컨텍스트를 반드시 되돌린다
        불변식 INV-1(진입·종료 짝 맞음)이 이 미들웨어를 검증한다.
    trigger_error:
      역할: "Sentry 연동 테스트용 의도적 오류 엔드포인트"
      등급: I
    rate_limit_handler:
      역할: "호출 횟수 초과 시 429 와 한국어 안내를 돌려준다"
      등급: I
    startup_event:
      역할: "서버 기동 — 자동 생성된 비밀값 경고 → DB 초기화 → 스케줄러 기동"
      등급: G
      핵심: true
      주의: |
        · 데모 모드에서 자동 생성된 JWT 키·비밀번호를 **로그로 알린다** (재시작 시 토큰 무효화 경고)
        · ★ 분할 취소 모드를 기동 시 1회 진단로그로 남긴다 — "auto 켰다고 믿었는데 안 켜진"
          상태로 무한 대기하는 걸 막는 장치
        · 환경변수로 스케줄러를 끌 수 있다 (테스트·마이그레이션용)
    shutdown_event:
      역할: "서버 종료 시 스케줄러 정지"
      등급: I
    root:
      역할: "루트 안내 응답"
      등급: I
    health_check:
      역할: "헬스체크 — DB 연결을 실제로 확인"
      등급: I
      주의: "★ 운영 모드에서는 오류 메시지를 `error` 로만 표시한다 — 내부 정보 노출 방지. 데모 모드에서만 상세 메시지"

- module: db/database.py
  fns:
    session_for_tenant:
      역할: "그 테넌트로 격리된 DB 세션을 만든다. **거의 모든 정상 경로가 이걸 쓴다**"
      등급: G
      핵심: true
      주의: "★ 세션 자체가 테넌트 컨텍스트를 들고 다닌다 — 비동기 작업들 사이에서 값이 새지 않는다. 테넌트 id 가 None 이면 예외"
    session_bypass:
      역할: "테넌트 격리를 우회하는 세션. 초기화·마이그레이션·잡 부트스트랩 전용"
      등급: G
      핵심: true
      주의: "★ 이걸 잘못 쓰면 다른 테넌트 데이터가 섞인다. 사용처가 제한적이어야 하고, 실제로 코드 곳곳에 '우회가 새면' 을 가정한 이중 방어가 들어가 있다"
    session_unscoped:
      역할: "테넌트 개념이 없는 모델(User·Tenant)용 세션"
      등급: G
      주의: "테넌트 모델을 조회하면 **예외가 난다**(fail-closed) — 실수로 쓰면 조용히 넘어가지 않는다"
    get_db:
      역할: "FastAPI 의존성 — 테넌트 컨텍스트 없는 세션"
      등급: G
      주의: "테넌트 격리가 필요한 엔드포인트는 반드시 `get_tenant_scoped_db` 를 써야 한다. 이걸 쓰면 예외"
    init_db:
      역할: "DB 테이블 생성 + **런타임 자동 마이그레이션** + 기본 계정 시드"
      등급: L
      핵심: true
      주의: |
        ⚠️ **387줄짜리 자동 마이그레이션이 부트스트랩 함수 안에 통째로 있다.**
        컬럼이 있는지 검사하고 없으면 `ALTER TABLE` 을 직접 실행하는 블록이 수십 개 쌓여 있다.
        일부는 데이터 백필까지 한다 (예: 상품명에 '파티만' 이 들어가면 구역 힌트를 party 로).
        Alembic 이 이미 있는데 이중화된 상태 — 이식 범위에 넣을지 사람이 결정해야 한다.
        DDL 이라 테넌트 필터와 무관하다.

- module: config.py
  fns:
    today_kst:
      역할: "오늘 날짜를 한국시간 기준 문자열로"
      등급: D
      핵심: true
      주의: "★ 날짜 판단의 단일 기준. 서버 시간대가 무엇이든 한국시간으로 고정된다"
    today_kst_date:
      역할: "오늘 날짜를 한국시간 기준 date 객체로"
      등급: D
      핵심: true
    Settings.validate_secrets:
      역할: "운영 모드에서 필수 비밀값이 없으면 **부팅을 막는다**"
      등급: G
      핵심: true
      주의: "★ 데모 모드면 자동 생성하고 경고만, 운영 모드면 아예 못 뜨게 한다. CORS 가 `*` 인 것도 운영에서는 거부"
    get_settings:
      역할: "설정 싱글톤 (캐시)"
      등급: I

- module: services/event_sms_hook.py
  fns:
    schedule_event_sms_hook:
      역할: "신규 예약에 이벤트 문자를 즉시 보내는 작업을 백그라운드로 띄운다"
      등급: G
      핵심: true
      주의: |
        ★ **호출자를 절대 막지 않는다**(fire-and-forget). 설계 원칙 7가지가 전부 호출자 보호용:
        ① 예외를 절대 전파하지 않음 ② 별도 DB 세션 ③ 이벤트 스케줄 0개면 즉시 종료
        ④ 스케줄 단위 격리 ⑤ 발송 단위 격리 ⑥ 테넌트 컨텍스트 명시 주입 ⑦ 발신기 획득
        실패 시 그 테넌트만 포기
        · 테넌트 id 가 없으면 중요 로그 남기고 포기
        · ★ **비동기 루프가 없으면**(동기 컨텍스트·테스트) 훅을 건너뛴다. 메인 흐름은 계속
    _log_task_result:
      역할: "백그라운드 작업이 끝나면 결과를 로그로 남긴다"
      등급: I
    _run_event_hook:
      역할: "이벤트 문자 발송 본체 — 별도 세션에서 스케줄별·사람별로 격리 실행"
      등급: D
      핵심: true
      주의: |
        · 활성 이벤트 스케줄이 0개면 빠른 종료
        · 발신기는 **1회만** 획득 (테넌트별)
        · ★ 대상 선정을 **신규 예약 id 로 제한**해서 이벤트 대상 함수를 재사용한다.
          별도 로직을 안 만든 게 중요 — 정기 발송과 판정이 갈리지 않는다
        · 스케줄 하나가 실패해도 다음 스케줄로, 한 명이 실패해도 다음 사람으로 계속
    _send_one:
      역할: "이벤트 문자 한 건 발송 + 칩 기록"
      등급: D
      주의: "날짜를 지정하지 않는다 — 이벤트는 특정 날짜와 무관하기 때문"

- module: providers/base.py
  fns:
    SMSProvider.send_sms:
      역할: "[인터페이스] 문자 단건 발송 규약"
      등급: L
    SMSProvider.send_bulk:
      역할: "[인터페이스] 대량 발송 규약"
      등급: L
    SMSProvider.simulate_receive:
      역할: "[인터페이스] 수신 시뮬레이션 규약"
      등급: L
    ReservationProvider.sync_reservations:
      역할: "[인터페이스] 예약 동기화 규약"
      등급: L
    ReservationProvider.get_reservation_details:
      역할: "[인터페이스] 예약 상세 조회 규약"
      등급: L
    ReservationProvider.fetch_by_checkin_date:
      역할: "[인터페이스] 체크인일 기준 조회 규약"
      등급: L
      주의: "⚠️ 이 Protocol 들은 **구현체가 각각 1개뿐**이다 (Mock 이 전부 제거됨). 죽은 추상화 — 이식 시 유지할지 사람이 결정해야 한다"
