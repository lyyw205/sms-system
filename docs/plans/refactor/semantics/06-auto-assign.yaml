# 자동 객실 배정 + 무결성 가드 — "누구를 어느 방에 넣을 것인가" 알고리즘.
# 매일 10:01 스케줄러 + 네이버 동기화 직후 + 운영자 버튼에서 호출된다.

- module: services/room_auto_assign.py
  fns:
    auto_assign_rooms:
      역할: "특정 날짜의 미배정 예약을 방에 자동으로 채워 넣는다. 배정 후 칩 재계산·활동로그·실패알림까지 담당"
      등급: D
      핵심: true
      순서: "방 목록 조회 → 미배정 예약 조회 → 배정 실행 → flush → 문자칩 일괄 → 추가요금 일괄 → 업그레이드 일괄 → 성공로그 → 실패로그+SSE+진단"
      주의: |
        · 상품(biz_item)에 연결된 방만 후보. 연결이 하나도 없으면 즉시 종료
        · **테넌트 컨텍스트가 없으면 예외를 던진다**. 스케줄 조회에 명시 테넌트 필터를 거는데,
          이건 실제 사고 이력에서 나온 방어다 — 다른 테넌트 스케줄이 새어 들어와 엉뚱한
          테넌트 칩이 만들어졌고 그쪽 발신자가 그걸 집어 보냈다
        · 상품↔방 매핑에 `exists()` 를 쓰는데, 이건 SQLAlchemy Core 라 자동 테넌트 필터가
          안 걸린다. **명시 테넌트 매칭이 필수** — 빼면 다른 테넌트 방이 후보에 섞인다
        · 칩·추가요금·업그레이드는 배정을 다 끝낸 뒤 **한 번에 일괄** 처리한다.
          배정마다 하면 N배 중복이라 `skip_sms_sync=True` 로 미룬 것
        · 실패가 있으면 활동로그 + SSE 실시간 알림(앞 10건만) + 중요 진단로그
        · 진단로그 호출을 전부 try/except 로 감쌌다 — 로그 때문에 배정이 실패하지 않게

    _get_unassigned_reservations:
      역할: "그 날짜에 방이 없는 확정 예약을 찾는다"
      등급: D
      핵심: true
      주의: |
        · 테넌트 컨텍스트 없으면 예외
        · **명시 테넌트 필터가 필수**. 자동 필터가 우회 상태로 새면 다른 테넌트 예약이
          후보에 들어오고, 배정 INSERT 때 엉뚱한 테넌트 id 가 주입되어 유니크 제약과 충돌한다
        · 배정 제외 구역(파티만·언스테이블·액티비티)은 뺀다
        · SQL 로 1차 추린 뒤 **파이썬에서 한 번 더 거른다** — 체크아웃이 없거나(당일),
          체크아웃이 그날 이후거나, 체크인이 바로 그날인 예약만. 이 2차 필터를 빼면
          이미 나간 손님에게 방을 준다

    _sort_candidate_rooms:
      역할: "후보 방을 정렬한다. 3인 이상 예약은 트윈3인실을 먼저, 2인 이하는 3인실을 최후로 (3인 예약용으로 아껴둠)"
      등급: D
      주의: "등급 4(트윈3인실)만 특별 취급하고 스위트(5)는 제외. 등급이 없으면 3인실이 아닌 것으로 안전하게 취급. 같은 등급 안에서는 성별별 우선순위 → 표시순서 → id 순"

    _gender_sort_key:
      역할: "배정 순서를 정한다 — 여성 먼저, 남성 다음, 성별 미상 마지막"
      등급: D
      주의: "'여2' 같은 합성 표기도 올바르게 정규화해서 판단한다"

    _assign_all_rooms:
      역할: "실제 배정 알고리즘. 후보 예약을 하나씩 돌며 맞는 방을 찾아 넣는다"
      등급: D
      핵심: true
      주의: |
        · 여성 → 남성 → 미상 순으로 처리한다 (도미토리 성별 잠금이 먼저 잡히도록)
        · **같은 방 유지** 우선 — 연박그룹이면 그룹이 쓰던 방, 단일 연박자면 전날 자기 방을
          후보 맨 앞으로 끌어온다. 이게 없으면 연박 손님이 매일 방이 바뀐다
        · 도미토리는 (1) 전 투숙 기간 용량 검사 (2) **전 투숙 기간 성별 잠금 검사**.
          성별 검사가 예전엔 그날 하루만 봐서 연박 중간일 혼숙이 통과했었다 — 용량 검사와
          범위를 맞춘 것이므로 다시 하루로 좁히면 안 된다.
          체크아웃이 없으면(1박) 그날 하루만 본다
        · 일반실은 항상 정원 1로 검사한다. 다객실 예약은 동기화 단계에서 이미 쪼개져서
          모든 행이 1방짜리로 정규화돼 있기 때문
        · 정렬용 인원수는 인원 → 남+여 → 1 순으로 구한다. **방 개수(booking_count)를
          폴백에서 뺐다** — 3방 예약을 3인으로 오판하지 않게
        · 실패 사유 4종을 구분해 기록: 후보방없음 / 정원초과 / 성별잠금 / 전부점유
        · 배정할 때마다 그룹의 방 지도를 갱신해서 다음 그룹 멤버가 같은 방을 우선하게 한다

    reconcile_stale_chips:
      역할: "그 날짜에 걸치는 모든 확정 예약의 칩을 한 번씩 다시 계산해 누락·잔여를 고친다 (하루 1회)"
      등급: D
      주의: |
        옛 방식은 '칩이 0건인 예약' 만 골라 복구해서, 4개 중 2개만 있는 부분 누락을 놓쳤다.
        지금은 기간이 겹치는 확정 예약을 **전부** 통과시킨다 — 멱등이라 정상이면 아무 일도 없다.
        예약마다 **개별 커밋**하고, 실패해도 롤백 후 다음 예약으로 넘어간다.
        칩 개수가 실제로 바뀐 건만 중요 로그로 표시해 나중에 추적 가능하게 한다.

    daily_assign_rooms:
      역할: "매일 10:01 스케줄러가 부르는 일일 배정. 오늘과 내일을 채운다"
      등급: D
      핵심: true
      주의: |
        ★ **채우기만 한다(FILL-ONLY)**. 기존 배정은 자동이든 수동이든 절대 건드리지 않고,
        삭제도 하지 않는다. 예약이나 방 설정이 바뀌어 생기는 엣지 케이스는 각 API 가
        따로 처리한다(제약 검증, UI 경고 배너).
        마지막에 칩 정합 복구를 한 번 돌린다 (실패해도 배정 결과는 유지).

- module: services/room_assignment_invariants.py
  fns:
    check_assignment_validity:
      역할: "지금 잡혀 있는 배정이 예약의 인원·성별 제약을 어기는 날짜를 찾아낸다"
      등급: G
      핵심: true
      주의: |
        · **과거와 오늘 배정은 검사하지 않는다** — 이미 지난 걸 바꾸는 건 비현실적
        · 도미토리만 검사한다. **일반실 공동 점유는 정책상 허용** (운영자가 의도적으로 넣은 것)
        · 성별 충돌을 먼저 보고, 걸리면 용량은 안 본다(continue)
        · 다른 예약의 인원을 셀 때 예약 정보를 못 찾으면 1명으로 친다
        호출자는 반드시 try/except 로 감싸야 한다 (검사 실패가 본 작업을 막지 않게)
    check_room_config_impact:
      역할: "방 설정을 바꾸면 영향받을 미래 예약 목록을 알려준다 (UI 경고용)"
      등급: I

- module: services/room_assignment.py
  fns:
    check_capacity_all_dates:
      역할: "그 방이 투숙 전 기간 내내 자리가 있는지 검사. 연박 손님이 매일 같은 방을 쓰게 하려는 것"
      등급: D
      핵심: true
      주의: |
        · 비활성이거나 숨김 방은 무조건 False
        · **일반실은 정원을 1로 하드코딩**한다 (자동배정 정책). 수동 배정은 이 검사를
          거치지 않고 assign_room 의 분기에서 우회된다
        · 도미토리는 날짜별 점유를 한 번의 JOIN+GROUP BY 로 모아 계산한다.
          점유 인원은 인원 → 방개수 → 1 순으로 구한다
        · 하루라도 넘치면 즉시 False — 전 기간이 다 통과해야 한다

- module: services/dorm_gender.py
  fns:
    single_gender:
      역할: "정렬·우선순위용 단일 성별 — 여성전용 '여', 남성전용 '남', 혼성이거나 모르면 빈 문자열"
      등급: D
      주의: "'여2' 같은 합성 표기를 인원수 기준으로 정규화한다. 혼성 예약은 빈 문자열이라 성별 우선순위가 적용되지 않는다"
