# 스케줄 실행기 — "정해진 시각에 누구에게 어떤 문자를 보낼지" 결정하고 실제로 보내는 곳.
# 대상 선정 경로가 3갈래(표준 / 이벤트 / 커스텀)로 완전히 다르다.

- module: scheduler/template_scheduler.py
  fns:
    TemplateScheduleExecutor.__init__:
      역할: "실행기 초기화 — DB 세션과 테넌트별 문자 발신기를 준비"
      등급: I

    TemplateScheduleExecutor.execute_schedule:
      역할: "스케줄 하나를 실행한다. 대상을 뽑고, 한 명씩 문자를 렌더링해 보내고, 결과를 칩에 기록하고, 활동로그를 남긴다"
      등급: D
      핵심: true
      순서: "스케줄 로드 → 발송조건 검사 → 대상 선정 → (예약별) 발송 → 성공/실패 즉시 커밋 → 스케줄 실행시각 갱신 → 활동로그 → 실시간 알림"
      주의: |
        · ★ **한 건 보낼 때마다 즉시 커밋**한다. 뒤에서 멈춰도 이미 보낸 건 기록이 남아
          다음 실행에서 중복 발송되지 않게 하려는 것. 이 즉시 커밋을 없애면 중복 발송 위험
        · 실패도 즉시 커밋한다 (실패 기록이 남아야 다음에 재시도 여부를 판단)
        · 스케줄이나 템플릿이 없거나 비활성이면 조기 종료. **종료 사유(outcome)를 진단로그에
          반드시 남긴다** — 이건 검증 규칙(INV-3)으로 강제되는 6가지 값 중 하나여야 한다
        · 성비 조건은 **표준 스케줄에만** 적용한다 (이벤트·커스텀은 무관)
        · 대상이 0명이어도 '마지막 실행 시각' 은 갱신한다
        · 이벤트 스케줄은 대상 날짜를 무조건 오늘로 고정. 커스텀은 지정이 없으면 '오늘' 로 보정
        · 방 표시 이름을 만들 때 방번호에 이미 건물명이나 '호' 가 들어있으면 중복해서 안 붙인다
        · 예약별 발송 실패는 개별 try/except 로 격리 — 한 명 실패가 나머지를 막지 않는다
        · 전체 예외는 Sentry 로 보내고 롤백한 뒤 중요 진단로그를 남긴다

    TemplateScheduleExecutor.get_targets:
      역할: "대상 선정의 갈림길 — 이벤트면 전용 경로, 나머지는 표준 경로"
      등급: D
      핵심: true
      주의: "`for_preview=True` 면 부작용이 있는 단계(칩 새로고침)를 건너뛴다. 미리보기가 실제 칩 상태를 바꾸면 안 되기 때문"

    TemplateScheduleExecutor._apply_structural_filters:
      역할: "구역·건물·컬럼 조건을 쿼리에 적용 (filters 모듈로 넘기는 얇은 껍데기)"
      등급: I

    TemplateScheduleExecutor._refresh_custom_chips:
      역할: "커스텀 발송 직전에 칩 상태를 최신으로 맞춘다. 배정 변경·동기화 같은 실시간 경로가 놓친 게 있어도 여기서 보정된다"
      등급: G
      주의: "핸들러가 없거나 실패해도 **발송을 막지 않는다** — 로그만 남긴다"

    TemplateScheduleExecutor._check_send_condition:
      역할: "남녀 성비 조건을 만족할 때만 보내는 기능 (예: 남:여가 2:1 이상일 때 여성 이벤트 문자)"
      등급: D
      주의: |
        · 기준 날짜는 오늘 또는 내일
        · **액티비티 인원을 제외**한다 — 안 하면 성비 판정이 오염된다
        · 여성이 0명이면 비율을 못 구한다. 남성도 0이면 데이터 없음으로 보고 발송 안 함,
          남성만 있으면 비율을 무한대로 쳐서 '이상' 조건은 통과 / '이하' 조건은 탈락
        · 모르는 연산자면 발송한다(관대한 폴백)

    TemplateScheduleExecutor._get_targets_standard:
      역할: "표준·커스텀 스케줄의 대상 선정. 이 시스템에서 조건이 가장 많이 겹치는 함수"
      등급: D
      핵심: true
      주의: |
        조건이 순서대로 쌓인다.
        (1) **명시 테넌트 필터** — 자동 필터가 우회 상태로 새면 다른 테넌트 손님에게 문자가
            나간다. 실제 위험이라 방어가 들어가 있다
        (2) 확정 상태만
        (3) **커스텀 전용 사전추림** — 그 날짜에 미발송 칩이 있는 예약으로 후보를 좁힌다.
            칩이 곧 '자격 표시' 이고, 아래 필터들이 실제 발송 여부를 결정한다.
            ★ 칩 조회를 **템플릿 키 기준**으로 해서, 같은 종류의 다른 시간대 스케줄이
            만든 칩도 집어간다 — 10시에 실패한 걸 15시가 재시도할 수 있게 하는 장치
        (4) **안전장치: 체크인이 오늘 기준 -7일 ~ +1일** 안이어야 한다. 이 범위 밖 예약에는
            절대 안 나간다
        (5) 날짜 조건 — 기본은 '그날 투숙 중', 첫밤 모드면 체크인일로 좁힘.
            마지막밤은 여기서 안 하고 나중에 파이썬으로 거른다
        (6) 구역·건물·컬럼 조건
        (7) **중복 방지** — 이미 보냈거나 실패한 건 제외. 여기도 명시 테넌트 매칭 필수
            (`exists()` 는 자동 필터가 안 걸림).
            표준은 항상 날짜별, 커스텀은 기본이 날짜 무관(투숙 1회)이되
            파티 MMS 같은 특정 종류만 날짜별로 허용
        (8) 마지막밤 후처리, 연박 제외 옵션
        (9) 커스텀이면 '칩은 있는데 발송 대상에서 빠진' 예약을 가드별로 분류해 중요 로그 발화

    TemplateScheduleExecutor._emit_blocked_breakdown:
      역할: "칩은 만들어졌는데 발송 대상에서 빠진 예약을 '어느 가드에 걸렸나' 로 분류해 진단로그를 남긴다"
      등급: I
      주의: "막힌 게 있을 때만 추가 쿼리 5개를 돈다. 필터를 제거해도 안전한지 검증하는 데 쓰인다"

    TemplateScheduleExecutor._get_targets_event:
      역할: "이벤트 스케줄(신규 예약 즉시 안내) 대상 선정. 표준과 완전히 다른 경로"
      등급: D
      핵심: true
      주의: |
        · ★ **오늘과 과거 체크인은 무조건 제외**한다. 이미 늦었거나 안내 효과가 없기 때문.
          설정이 비어 있어도 항상 적용되는 안전장치
        · ★ **구역·건물 조건을 적용하지 않는다** (대상이 아직 미배정인 경우가 대부분).
          그래서 액티비티 제외를 **base 쿼리에서 직접** 해야 한다 — 공통 필터가 안 걸리므로
        · 성별 필터는 표시 문자열 OR (해당 성별 인원>0 AND 반대 성별 없음). 문자열만 보면
          '여2' 같은 합성 표기를 놓친다
        · '예약 확정 후 N시간 이내' 는 SQL 이 아니라 파이썬으로 거른다. 확정시각이 없는
          수동 예약은 제외
        · 중복 방지는 **날짜 무관** — 한 번 보냈으면 끝

    TemplateScheduleExecutor.auto_assign_for_schedule:
      역할: "스케줄 하나에 대해 칩을 일괄 생성·정리 (chip_reconciler 로 위임)"
      등급: I

    TemplateScheduleExecutor.preview_targets:
      역할: "실제로 보내지 않고 대상 목록만 미리 보여준다"
      등급: I
      주의: "부작용 없는 모드로 호출한다. 방 번호는 배정표에서 조회하고, 없으면 예약행의 낡은 값으로 폴백"

    TemplateScheduleExecutor._resolve_date_target:
      역할: "'오늘/내일' 표현을 실제 날짜로 변환 (공용 헬퍼 호출)"
      등급: I

    TemplateScheduleExecutor._filter_last_day:
      역할: "'마지막 밤' 스케줄 대상만 남긴다. 연박그룹이면 그룹 전체의 마지막 체크아웃 기준"
      등급: D
      핵심: true
      주의: |
        · 당일 1박(체크아웃 없음/체크인과 같음)은 체크인일이 곧 마지막 밤
        · 연박그룹은 **그룹 안 최대 체크아웃 − 1일**. 그룹에 체크아웃이 하나도 없으면 제외
        · 단독 예약은 자기 체크아웃 − 1일. 손으로 연장한 예약(그룹 없이 여러 날)도 이 경로가 맞다
        ⚠️ 칩을 만들 때는 **각 멤버 자신의 체크아웃**을 보고, 여기서는 **그룹 최대값**을 본다.
        두 기준이 어긋나면 칩 생성일과 발송 필터일이 달라 조용히 미발송된다 (알려진 불일치)
