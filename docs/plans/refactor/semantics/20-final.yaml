# 마무리 — 예약 CRUD 본체(RES-A 기능카탈로그와 대응) · 소규모 CRUD · 내부 헬퍼·중첩함수.

- module: api/reservations.py
  fns:
    get_reservations:
      역할: "예약 목록을 조건에 맞게 찾아 날짜별 실제 상태(방·파티차수·메모)를 입혀 돌려준다"
      등급: D
      핵심: true
      주의: |
        기능 18개가 이 한 함수에 있다 (상세는 기능 카탈로그 F-RES-001~018).
        · 객실 정보는 **항상 배정표에서** — 예약행의 낡은 값은 안 쓴다
        · 날짜를 지정하면 그날 배정만, 안 하면 각자 체크인일 기준
        · 날짜별 덮어쓰기 3종(파티차수·메모·언스참여)의 **폴백 규칙이 셋 다 다르다**
        · 언스테이블 동시예약 감지는 **현재 응답 페이지 안에서만** 대조한다 (경계 누락 가능)
    create_reservation:
      역할: "직원이 손으로 예약을 새로 만든다"
      등급: D
      순서: "add → flush → 연박여부 계산 → flush → 칩 생성 → commit. 칩이 예약 id 를 요구해 flush 2번 필수"
      주의: "체크아웃 빈 문자열은 NULL 로 정규화. 구역 기본값은 '미배정'. **방문횟수를 비워** 이름 옆 꼬리표가 안 뜨게 한다(수동 생성 전용 규칙). ⚠️ 관문(Mutator)을 타지 않는다"
    update_reservation:
      역할: "예약을 고친다. 취소·복구·날짜변경이 전부 여기로 들어온다"
      등급: G
      핵심: true
      순서: "관문 적용 → **바로 다음** 핀 해제 블록(순서 변경 금지) → 취소/복구 분기 → 날짜·제약 후처리 → 칩 재계산"
      주의: |
        기능 21개 (F-RES-026~047). 가장 위험한 것들:
        · ★ **취소→확정 복구 시 핀 해제는 관문 바로 다음**이어야 한다. 관문이 핀을 다시 박기
          때문에 그 직후에 풀어야 최종 결과가 '해제' 가 된다. 앞으로 옮기면 핀이 영구히 남아
          네이버가 영영 못 고친다
        · 분할 형제는 복구해도 핀을 유지 (운영자 복구 신호로 쓰임)
        · 경보 2종이 **전이 게이트**로 보호된다 — 복구는 `직전이 취소` 일 때만, 취소는
          `직전이 취소 아님` 일 때만. 현재 값만 보면 헛경보·중복경보가 난다
        · 경보는 SAVEPOINT 로 격리 — 실패해도 본 수정은 성공
        · 취소 시 연장표시·잠금을 지운다 (안 지우면 재활성 시 동기화 영구 차단)
    delete_reservation:
      역할: "예약을 지운다. 네이버 예약은 지우지 않고 취소 표시만"
      등급: D
      핵심: true
      주의: |
        ★ **분기점**: 네이버 예약번호가 있으면 soft cancel(행 유지 + 잠금), 없으면 진짜 삭제.
        네이버 예약을 지우면 5분 뒤 동기화가 되살려버리기 때문.
        발송된 칩은 취소 경로에서 보존, 삭제 경로에서는 함께 제거 — **비대칭이 의도된 것**.
        분할 형제 경보는 **커밋 이후** 격리 실행하고, 결과를 응답 메시지에 붙여 알린다.
    sync_from_naver:
      역할: "직원이 버튼으로 네이버 예약을 즉시 가져온다"
      등급: D
      주의: "분당 5회 제한. 언스테이블 설정이 있으면 함께 동기화하되, **언스 실패는 삼키고** 스테이블 결과는 정상 반환"

