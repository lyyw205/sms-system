# 도메인 값 사전 — "이 칸에 들어갈 수 있는 값은 무엇이고 각각 무슨 뜻인가".
# 리팩토링 시 값 하나라도 빠지면 그 경로가 조용히 죽는다.
#
# 형식:
#   축     : 값이 들어가는 자리 (컬럼 또는 설정)
#   값     : 가능한 값 전부 + 뜻
#   정의처 : 값 목록이 코드 어디에 있나 (없으면 하드코딩 분산)
#   함정   : 재작성 시 놓치기 쉬운 것

axes:

# ══════════════════════════════════════════════════════════════
# A. 예약 분류
# ══════════════════════════════════════════════════════════════
- 축: Reservation.section (구역)
  정의처: services/section_registry.py SECTIONS
  기본값: "'unassigned' (NULL·빈값·모르는 값 전부 여기로)"
  값:
    room: "객실 — 방을 배정받는 숙박 손님"
    unassigned: "미배정 — 아직 방이 없는 숙박 손님"
    party: "파티만 — 숙박 없이 파티만 참여"
    unstable: "언스테이블 — 별도 네이버 계정에서 온 파티"
    activity: "액티비티 — 숙박이 아닌 체험 상품 (차량투어 등)"
  성질표: "값마다 7개 속성이 정해져 있다 — 배정대상 / 숙박인원집계 / 체크아웃개념 / 드래그가능 / 파티차수상속 / 네이버인입허용 / 한글라벨"
  함정: |
    ★ 성질표가 담지 못하는 **오버레이 5종**이 있다. 구역 단독이 아니라 다른 플래그와 결합하는 로직이라
      명세서와 호출처에 **둘 다** 존재해야 한다:
      ① 방이 배정됐으면(room_id 있음) 구역 무관하게 '배정됨' 취급
      ② 그날 언스 참여 표시가 있으면 다른 구역 손님도 언스 명단·집계에 복사됨
      ③ 파티차수가 참여값이면 어느 구역이든 파티 명단·통계에 포함
      ④ 프론트의 즉시성 오버라이드
      ⑤ 객실 필터의 건물/미배정포함 수식어
    ★ 액티비티는 **한 번 되면 못 바꾼다** (관문이 전이를 거부). 배정도 거부된다.
    ★ 네이버가 보낼 수 있는 값은 화이트리스트로 제한 — 목록 밖이면 '미배정'

- 축: Reservation.party_type (파티 차수)
  정의처: services/party_type.py — PARTY_JOINED_TYPES / PARTY3_2CHA_TYPES
  값:
    "1": "1차만 참여"
    "2": "1차 + 2차 참여"
    "2차만": "2차만 참여"
    "NULL / ''": "파티 미참여"
  일자별확장: "ReservationDailyInfo.party_type 에는 'X'(미참여) 가 추가로 들어간다 — 예약 기본값을 그날만 뒤집는 용도"
  함정: |
    ★ **두 집합을 절대 합치면 안 된다**:
      · 파티 참여(아무 차수) = {1, 2, 2차만} → 통계·체크인명단·매출·필터
      · 2차 참여만 = {2, 2차만} → 파티 당일 MMS 전용
      좁은 쪽을 넓히면 1차만 손님에게 오발송, 넓은 쪽을 좁히면 통계 누락.
    ★ 날짜별 덮어쓰기의 **폴백 규칙이 호출처마다 3가지** — 의도된 차이라 통일 금지:
      · Python truthy → None 과 '' 둘 다 예약값으로 폴백
      · SQL coalesce → NULL 만 폴백, '' 는 그대로 채택
      · `is not None` → None 만 폴백 (그리드 표시용)

- 축: Reservation.status (예약 상태)
  정의처: db/models.py ReservationStatus enum
  값:
    pending: "대기"
    confirmed: "확정 — 거의 모든 발송·배정 로직의 대상"
    cancelled: "취소"
    completed: "완료 — 인원 통계에는 확정과 함께 포함"
  함정: |
    ★ 상태 잠금(manually_edited_fields['status'])이 걸리면 네이버가 못 바꾼다.
      잠금 상태에서 3갈래로 분기하고, 그중 하나는 **잠금을 스스로 제거**한다.
    ★ 인원 스냅샷은 확정+완료를 세지만, 발송 대상은 확정만.

- 축: Reservation.booking_source (예약 경로)
  정의처: 없음 — 컬럼 주석과 코드에 분산
  값:
    naver: "네이버 예약"
    manual: "직원 수기 입력"
    phone: "전화 예약"
    naver_split: "★ 다객실 예약을 쪼갠 형제 행"
  함정: |
    ★ `naver_split` 이 가장 중요하다. 이 값이면:
      · 다음 동기화에서 매칭 후보가 아님 (예약번호가 비어있음)
      · 연박 감지에서 제외 (가짜 체인 방지)
      · 분할 그룹 경보의 대상(형제)
      · 통계·최근목록에서 제외 (중복 노출 방지)
    ★ 정의처가 없어서 오타를 컴파일 타임에 못 잡는다 — 명세 모듈 후보

# ══════════════════════════════════════════════════════════════
# B. 문자 칩
# ══════════════════════════════════════════════════════════════
- 축: ReservationSmsAssignment.assigned_by (칩 출처)
  정의처: services/chip_store.py PROTECTED_ASSIGNED_BY
  값:
    auto: "예약 기준 자동 정합이 만든 칩 — 자동 삭제 대상"
    schedule: "스케줄 기준 자동 정합이 만든 칩 — 자동 삭제 대상"
    manual: "운영자가 직접 붙임 — 보호"
    excluded: "운영자가 '발송 제외' 로 표시 — 보호 + **재생성도 차단**"
    failed: "발송 실패 기록 — 보호"
  함정: |
    ★ 보호 대상 3종(manual/excluded/failed)은 자동 정합이 **삭제하지 못한다**.
    ★ `excluded` 는 삭제 보호뿐 아니라 **생성 차단**도 해야 한다. 안 그러면 매번 부활한다.
    ★ 옛 데이터 호환 — `auto` 인데 `send_status='failed'` 인 칩도 보호 대상
    ★ RoomAssignment 에도 같은 이름의 컬럼이 있지만 값 집합이 다르다 (auto/manual 뿐)

- 축: ReservationSmsAssignment.send_status (발송 결과)
  값:
    "NULL": "미발송"
    sent: "발송 성공"
    failed: "발송 실패"
  함정: "실패 칩은 중복 방지 대상에도 포함된다 — 실패했으면 자동 재시도하지 않는다"

# ══════════════════════════════════════════════════════════════
# C. 스케줄 (발송 대상 선정)
# ══════════════════════════════════════════════════════════════
- 축: TemplateSchedule.schedule_category (스케줄 종류)
  값:
    standard: "표준 — 칩 기반 정기 발송"
    event: "이벤트 — 신규 예약 즉시 안내"
    custom_schedule: "커스텀 — 별도 판정 로직 5종"
  함정: |
    ★ **대상 선정 경로가 셋 다 완전히 다르다**:
      · 구역·건물 필터: 표준 O / 이벤트 **X** / 커스텀 O
      · 액티비티 격리: 표준·커스텀은 공통 필터가 처리, 이벤트는 **base 쿼리에서 직접**
      · 중복 방지: 표준=날짜별 / 이벤트=날짜무관 / 커스텀=기본 날짜무관(일부만 날짜별)
      · 사전 추림: 커스텀만 '미발송 칩 보유자' 로 좁힘
    통합하면 사고. 이벤트가 공통 필터를 안 타는 게 특히 위험하다.

- 축: TemplateSchedule.schedule_type (반복 주기)
  값:
    daily: "매일 — 시·분 필수"
    weekly: "매주 — 시·분·요일 필수"
    hourly: "매시 — 분 필수"
    interval: "N분 간격 — 간격분 필수"
  함정: |
    ★ 간격은 트리거 생성이 **3갈래**: 60분 미만(분 크론) / 60의 배수(시 크론) /
      그 외 90분 등(간격 트리거). 마지막은 활성 시간대를 트리거로 표현할 수 없어서
      **실행 함수 안의 런타임 검사**가 대신 막는다.

- 축: TemplateSchedule.target_mode (노리는 밤)
  값:
    "NULL": "투숙 전 기간 매일"
    first_night: "첫날 밤만 — 연박그룹이면 순번 0번만"
    last_night: "마지막 밤만 — 연박그룹이면 마지막 멤버만"
  함정: |
    ★ 연박그룹에서 **해당 멤버가 아니면 빈 목록**을 돌려주는 게 중복발송 방지의 핵심.
    ★ 마지막밤 기준이 **두 곳에서 다르다** — 칩 생성은 멤버 자신의 체크아웃,
      발송 필터는 그룹 최대 체크아웃. 어긋나면 조용히 미발송 (알려진 불일치)

- 축: TemplateSchedule.date_target (기준 날짜)
  값:
    today: "오늘 (오프셋 0)"
    tomorrow: "내일 (문자는 예약일 전날 발송 = 오프셋 −1)"
    yesterday: "어제 (문자는 예약일 다음날 발송 = 오프셋 +1)"
    "today_checkout / tomorrow_checkout": "🕰 옛 값 — 지금은 '오늘' 로 처리되고 중요 로그만 남는다"
  함정: "모르는 값이 와도 **조용히 오늘로 처리**한다. 로그가 유일한 단서"

- 축: TemplateSchedule.custom_type (커스텀 발송 종류)
  정의처: services/custom_schedule_registry.py CUSTOM_SCHEDULE_TYPES
  값:
    surcharge_standard: "인원 초과 안내 (일반 객실)"
    surcharge_double: "인원 초과 안내 (더블 객실 — 변경비 포함)"
    party3_today_mms: "파티 당일 안내 MMS (2차 참여자)"
    room_upgrade_promise: "무료 업그레이드 약속 (첫박)"
    room_upgrade_review: "무료 업그레이드 후기 요청 (마지막박)"
  함정: |
    ★ **날짜별 중복 허용은 party3_today_mms 하나뿐** (연박자가 매일 파티에 참여하므로).
      나머지는 투숙 1회.
    ★ 발송 직전 새로고침 핸들러가 종류별로 등록돼 있다 — 추가요금 2종은 같은 핸들러 공유.
    ★ MMS 경로로 라우팅되는 것도 party3_today_mms 하나뿐

- 축: TemplateSchedule 필터 JSON
  정의처: services/filters.py — _ASSIGNMENT_VALUES / _COLUMN_MATCH_COLUMNS
  값:
    "type=assignment": "구역 조건. value ∈ {room, party, unassigned, unstable}"
    "type=column_match": "칸 조건. value = '{칸}:{연산자}:{텍스트}'"
    "🕰 building / room / room_assigned / party_only / has_unassigned": "옛 형식 — 읽을 때 새 형식으로 변환"
  칸: "party_type · gender · naver_room_type · notes · customer_name (5종)"
  연산자: "contains · not_contains · is_empty · is_not_empty"
  함정: |
    ★ **결합 규칙**: 구역 여러 개 = OR, 칸 여러 개 = AND, 둘 사이 = AND
    ★ 날짜에 의존하는 칸은 party_type·notes 둘뿐 — 후보 사전추림에서는 건너뛴다
    ★ 객실 조건만 수식어를 갖는다 (건물 목록 / 미배정 포함 / 연박 제외)
    ★ 메모 검색은 **투숙 전 기간**을 훑는다 (어느 날 적어도 첫밤·마지막밤 스케줄이 둘 다 걸리게)
    ★ 모르는 필터 항목은 조용히 무시된다
    ★ JSON 파싱이 깨지면 빈 목록 → **필터 없음 = 전원 대상**이 된다

- 축: TemplateSchedule.gender_filter / send_condition_*
  값:
    "gender_filter: male / female / NULL": "성별 대상 제한"
    "send_condition_date: today / tomorrow": "성비 판정 기준일"
    "send_condition_operator: gte / lte": "비율 이상/이하"
  함정: |
    ★ 성별 판정이 **표시 문자열 OR 인원수 기반** 이중이다. 문자열만 보면 '여2' 같은
      합성 표기를 놓친다.
    ★ 성비 계산에서 여성이 0명이면 비율이 무한대 — '이상' 은 통과, '이하' 는 탈락.
      남녀 둘 다 0이면 데이터 없음으로 보고 발송 안 함.
    ★ 모르는 연산자면 **발송한다**(관대한 폴백)

# ══════════════════════════════════════════════════════════════
# D. 쓰기 권한 · 보호 플래그
# ══════════════════════════════════════════════════════════════
- 축: ChangeSource × FIELD_PERMISSIONS
  정의처: services/reservation_mutator.py
  값:
    "출처: naver / manual / system": "누가 바꾸려 하는가"
    "권한: guarded / always / never": "잠금 확인 후 / 무조건 / 금지"
  대상필드: "17개 — 날짜 2 · 이름/전화/방문자 4 · 요청사항 · 인원 3 · 성별 · 상태 · 구역 · 객실타입 · 예약옵션 · 금액"
  함정: |
    ★ 표에 **없는 필드는 무조건 통과**한다(allow-all) — 새 필드를 추가하면 자동으로 보호되지 않는다
    ★ 특이 조합: 구역은 네이버 금지 / 객실타입·예약옵션은 직원 금지 /
      상태는 직원 always 지만 자동 잠금이 박혀 네이버 부활을 차단
    ★ 잠금 확인이 **두 메커니즘 병행** — 옛 pin 컬럼 2개 + 새 방명록 dict

- 축: 보호 플래그 8종
  값:
    check_in_pinned / check_out_pinned: "날짜를 직원이 고쳤음 — 네이버 덮어쓰기 차단"
    manually_edited_fields: "필드별 편집 시각 기록 (JSON) — 상태 포함"
    manually_extended_until: "🕰 직원이 연장했음 — 잠금 컬럼으로 대체 중이나 UI 표시·취소 진입 조건으로 아직 필요"
    gender_manual: "인원을 직원이 고쳤음 — 동기화 재계산 차단"
    stay_group_excluded: "직원이 연박에서 뗐음 — 자동 재묶기 영구 차단"
    "칩 assigned_by ∈ 보호집합 / sent_at 있음": "칩 자동 삭제 차단"
    "Room.is_active / is_hidden": "배정 차단 / 카드 미노출 + **미래 배정 삭제**"
  함정: |
    ★ 취소할 때 **연장 표시와 잠금을 반드시 지워야** 한다. 안 지우면 재활성 시
      동기화가 그 예약을 영원히 못 고친다.
    ★ 1박 이하로 축소해도 같은 해제가 필요하다.
    ★ 분할 형제는 복구해도 잠금을 **유지**한다 (운영자 복구 신호로 쓰임)

# ══════════════════════════════════════════════════════════════
# E. 날짜 · 시간
# ══════════════════════════════════════════════════════════════
- 축: check_in_date / check_out_date
  타입: "String(20) — ⚠️ 문자열이다. Postgres 전환 시 Date 로 바꿀 TODO 가 달려있음"
  값표현:
    "체크아웃 NULL": "당일 1박"
    "체크아웃 == 체크인": "당일 1박 (같은 뜻, 다른 표현)"
    "체크아웃 == ''": "★ 당일 1박이지만 **SQL 에서 갈라진다**"
  규약: "박 집합 = [체크인, 체크아웃) 반열림 — 체크아웃일은 박이 아님"
  함정: |
    ★ `''` 이 모든 문제의 뿌리다. Python truthy 로는 NULL 과 같지만 SQL 에서는:
      · `IS NULL` 에 안 걸림 · `func.max` 가 이걸 채택 · `'' > date` 는 항상 거짓
      출처는 네이버 어댑터의 날짜 변환 함수 (파싱 실패 시 `''` 반환)
    ★ 문자열 비교라 **날짜에 0 채움이 안 된 값**('2026-1-9')은 정렬이 어긋난다
    ★ 박수 계산의 `max(1, ...)` 바닥값이 **추가요금 금액에 그대로 들어간다** — 제거 금지
    ★ 마지막밤 계산에 당일 가드가 없어서, 체크아웃==체크인이면 **체크인 전날**을 반환한다
      (알려진 잠재버그 — 현행 보존)

- 축: 시간대
  값: "전부 Asia/Seoul(KST). today_kst() / today_kst_date() 가 단일 기준"
  함정: |
    ★ 네이버 시각 파싱은 시간대를 **제거**해야 한다(변환 아님). 변환하면 9시간 밀려
      취소목록·정렬이 깨지고, 안 떼면 매 동기화마다 전 행 UPDATE 가 나간다.
    ★ 확정시각·취소시각 컬럼은 naive 다.

- 축: 스케줄러 잡 시각
  값: "5분 / 09:43 / 09:50·08:50·11:50·00:50 / 09:55 / 10:01 / 15~20시 10분 / 00:05·12:05 / 0·6·12·18시"
  함정: |
    ★ **09:43 → 09:50 → 09:55 → 10:01 연쇄에 이유가 있다**:
      분할점검이 배정보다 먼저 떠야 운영자가 인지 가능 + 5분 격자를 피해 경합 제거
    ★ 당일 자동배정 컷오프 15시 — 이후엔 운영자 수동에 맡긴다
    ★ 스냅샷 갱신이 하루 4번인데 시각별 근거가 코드에 없다 (조사 항목)

