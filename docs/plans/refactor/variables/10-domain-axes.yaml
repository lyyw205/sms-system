# ══════════════════════════════════════════════════════════════
# I. 문자 템플릿 변수 (22종)
# ══════════════════════════════════════════════════════════════
- 축: "{{변수}}"
  정의처: templates/variables.py AVAILABLE_VARIABLES
  분류:
    예약: "customer_name · phone"
    객실: "building · room_num · room_type · room_password · prefix_room_password"
    파티: "participant_count · male_count · female_count + 어제/내일 각 3종"
    추가요금: "base_capacity · guest_count · excess · nights · surcharge_per_night · total_surcharge"
  함정: |
    ★ 방 변수(room_num·building·room_password·prefix_room_password)를 쓰는 템플릿인데
      값이 비면 **발송을 차단**한다 (빈칸 문자 방지)
    ★ 인원 통계는 그날 스냅샷 기준이라 하루 동안 고정된다. 문자 한 건 계산에
      스냅샷이 **최대 3개**(오늘·어제·내일) 생성될 수 있다
    ★ 버퍼 적용 우선순위 3단계 — 성비별 > 남/여 개별 > 전체. 성비 동점이면 '여성 우세' 설정
    ★ 방번호 첫 글자가 A/B 면 건물명을 'A동'/'B동' 으로 **덮어쓴다** (건물 테이블보다 우선)
    ★ 추가요금 변수는 특정 템플릿 키 2개에서만 주입된다
