# F. 객실
# ══════════════════════════════════════════════════════════════
- 축: Room.grade / NaverBizItem.grade (등급)
  정의처: services/room_grade.py ROOM_GRADE_LABELS
  값: "1 도미토리 < 2 더블 < 3 트윈 < 4 트윈3인실 < 5 스위트 (NULL = 미설정)"
  함정: |
    ★ 업그레이드 판정 = **배정 등급 > 상품 등급**. 한쪽이라도 NULL 이면 판정 불가 → 중요 로그 + 거부
    ★ 자동배정 정렬에서 **등급 4(트윈3인실)만 특별 취급** — 3인 이상은 앞으로, 2인 이하는
      뒤로 아껴둔다. 스위트(5)는 제외
    ★ 입력 검증에서 **bool 을 명시적으로 거부**한다 (Python 에서 True 는 int 1)

- 축: 정원 관련
  값:
    "Room.base_capacity": "기준 인원 (일반실)"
    "Room.max_capacity": "최대 인원"
    "Room.bed_capacity": "침대 수 (도미토리)"
    "NaverBizItem.default_capacity": "★ 상품 기준 인원 — 초과 판정의 진짜 기준"
  함정: |
    ★ 초과 판정은 **상품 기준**이지 방 기준이 아니다. 더블룸(2) 예약 손님을 스위트(4)에
      업그레이드해주고 3명이 오면 1명 초과로 청구해야 맞다. 예전에 방 기준으로 봐서
      초과 0으로 처리하던 버그가 있었다.
    ★ 자동배정의 일반실 정원은 **1로 하드코딩**된다 (한 방 한 팀 정책)
    ★ 인원 계산 우선순위: 인원 → 남+여 → 1. **방 개수는 폴백에서 뺐다**(3방=3인 오판 방지)

- 축: DOUBLE_ROOM_BIZ_ITEM_IDS
  값: "{'4779024'} — 더블룸 판정용 네이버 상품 id"
  함정: "★ **코드에 하드코딩**돼 있다. 상품이 바뀌면 코드 수정이 필요 — 설정으로 뺄 후보"

